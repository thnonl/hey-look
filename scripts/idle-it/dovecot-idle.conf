# Throw-away Dovecot 2.3 for the IDLE integration test (scripts/idle-it). Any user name works, the password is pw1.
# Used with: dovecot/dovecot:2.3-latest, this file mounted as /etc/dovecot/dovecot.conf, certificate made at start (run.ps1 / run.sh).
protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr
mail_location = maildir:/srv/vmail/%u/Maildir
first_valid_uid = 1
disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = required
ssl_cert = </tmp/dv/cert.pem
ssl_key = </tmp/dv/key.pem
# the server writes "* OK Still here" to idle clients this often (the default is 2 minutes): the test covers that path
imap_idle_notify_interval = 5 secs

passdb {
  driver = static
  args = password=pw1
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/vmail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
