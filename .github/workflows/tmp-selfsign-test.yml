name: tmp selfsign test
on:
  push:
    branches: [feature/v106-mac-selfsign]
    paths: [".github/workflows/tmp-selfsign-test.yml", ".github/scripts/mac-*.sh"]
jobs:
  t:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: info
        run: sw_vers; whoami; sudo -n true && echo sudo-ok; security list-keychains -d user; security default-keychain
      - name: import
        timeout-minutes: 4
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash .github/scripts/mac-import-selfsigned.sh 2>&1 | grep -v -i 'password\|APPLE_CERT'
      - name: sign tiny app like the bundler (identity by name, hardened runtime)
        timeout-minutes: 4
        env:
          ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          mkdir -p T/Hey.app/Contents/MacOS
          printf 'int main(void){return 0;}\n' > m.c
          clang -arch arm64 -arch x86_64 m.c -o T/Hey.app/Contents/MacOS/hey
          cat > T/Hey.app/Contents/Info.plist <<'P'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>CFBundleIdentifier</key><string>thnonl.heylook</string><key>CFBundleExecutable</key><string>hey</string><key>CFBundleName</key><string>Hey</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>
          P
          codesign --force -s "$ID" --options runtime T/Hey.app/Contents/MacOS/hey
          codesign --force -s "$ID" --options runtime T/Hey.app
          (cd T && tar -czf Hey.app.tar.gz Hey.app)
          bash .github/scripts/mac-verify-selfsigned.sh T/Hey.app "$ID" T/Hey.app.tar.gz
