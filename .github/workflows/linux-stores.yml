name: Linux stores

# The Linux store packages beside the release installers (release.yml builds the AppImage, .deb and .rpm):
# - metainfo: validates the AppStream file every Linux package ships and the desktop files, and that the version in the repo files and
#   the first <release> of the metainfo agree (every run; on a tag run also with the tag)
# - snap: builds the snap with snapcraft (every run, as a workflow artifact); a TAG PUSH uploads it to the Snap Store's `candidate`
#   channel only when the repository variable SNAP_PUBLISH is `true` (DEC-028: OFF by default, so a tag run without the store login secret is not red);
#   nothing else ever uploads (promote to `stable` by hand, see PACKAGING.md)
# What runs where:
#   tag push (v1.2.3)   metainfo + snap build, in the GitHub Environment `release`: the four OAuth client ids are written into `.env` for
#                       the build only (src-tauri/build.rs embeds them, the file is removed afterwards), then, with SNAP_PUBLISH=true only,
#                       the upload with the store login of that Environment
#   pull request        metainfo + snap build, no Environment, no secrets, no upload (also from forks)
#   manual run          the same as a pull request on the chosen ref, also when that ref is a tag (event_name is not push)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "snap/**"
      - "linux/**"
      - "package.json"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "CHANGELOG.md"
      - ".github/scripts/verify-version.cjs"
      - ".github/workflows/linux-stores.yml"
  workflow_dispatch:

concurrency:
  group: linux-stores-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  metainfo:
    name: Metainfo and desktop files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils python3-yaml
      - name: Validate
        run: |
          # strict first (the warnings and pedantic notes are visible in the log), then the AppImage's copy of the file under the name
          # appimagetool looks for (bundle.linux.appimage.files in src-tauri/tauri.conf.json)
          appstreamcli validate --no-net --pedantic linux/io.github.thnonl.HeyLook.metainfo.xml || true
          appstreamcli validate --no-net linux/io.github.thnonl.HeyLook.metainfo.xml
          cp linux/io.github.thnonl.HeyLook.metainfo.xml /tmp/hey-look.appdata.xml && appstreamcli validate --no-net /tmp/hey-look.appdata.xml
          # (the snap's Icon= path uses $SNAP, which desktop-file-validate does not know: checked with it replaced)
          sed 's|${SNAP}|/snap/hey-look/current|' snap/gui/hey-look.desktop > /tmp/hey-look.desktop && desktop-file-validate /tmp/hey-look.desktop
          python3 -c 'import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' snap/snapcraft.yaml
      # package.json, tauri.conf.json, Cargo.toml and the first <release> of the metainfo (the snap's version, the newest the software
      # centres show) must agree; a tag push must also equal the tag (the same check release.yml makes before it publishes)
      - name: Versions agree
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          node .github/scripts/verify-version.cjs "$V" .

  snap:
    name: Snap
    needs: metainfo
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # the Environment (its deployment rule: v* tags) and every secret below exist for a tag PUSH only; release.yml gates the same way
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: OAuth client ids (tag push only)
        env:
          PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          GOOGLE_CLIENT_ID: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.GOOGLE_CLIENT_SECRET || '' }}
          MICROSOFT_CLIENT_ID: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.MICROSOFT_CLIENT_ID || '' }}
          MICROSOFT_CLIENT_SECRET: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.MICROSOFT_CLIENT_SECRET || '' }}
        run: |
          if [ "$PUBLISH" = "true" ] && { [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$MICROSOFT_CLIENT_ID" ]; }; then
            echo "::error::a tag run needs GOOGLE_CLIENT_ID and MICROSOFT_CLIENT_ID in the environment release"
            exit 1
          fi
          umask 077
          {
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "MICROSOFT_CLIENT_ID=$MICROSOFT_CLIENT_ID"
            echo "MICROSOFT_CLIENT_SECRET=$MICROSOFT_CLIENT_SECRET"
          } > .env
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
      - name: Remove the OAuth client ids
        if: always()
        run: rm -f .env
      - name: Review the snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          ls -l "$SNAP_FILE"
          sudo snap install review-tools
          if review-tools.snap-review "$SNAP_FILE"; then
            echo "review-tools: ok"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::warning::review-tools.snap-review reported problems (see above); the store runs the same review on the upload"
          else
            echo "review-tools.snap-review reported problems (see above)"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
      - name: Upload to the Snap Store (candidate)
        if: github.event_name == 'push' && github.ref_type == 'tag' && vars.SNAP_PUBLISH == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: candidate
