name: Linux stores

# The Linux store packages beside the release installers (release.yml builds the AppImage, .deb and .rpm):
# - metainfo: validates the AppStream file every Linux package ships and the desktop files (every run)
# - snap: builds the snap with snapcraft; on a tag it is uploaded to the Snap Store's `candidate` channel (promote to `stable` by hand)
# A tag run reads the OAuth client ids from the environment `release` (as release.yml does) and writes them into `.env` for the snap build
# (src-tauri/build.rs embeds them); a manual run or a pull request builds without them.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "snap/**"
      - "linux/**"
      - ".github/workflows/linux-stores.yml"
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap Store channel to upload to (empty: build only)"
        required: false
        default: ""

concurrency:
  group: linux-stores-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  metainfo:
    name: Metainfo and desktop files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils python3-yaml
      - name: Validate
        run: |
          appstreamcli validate --no-net linux/io.github.thnonl.HeyLook.metainfo.xml
          # (the snap's Icon= path uses $SNAP, which desktop-file-validate does not know: checked with it replaced)
          sed 's|${SNAP}|/snap/hey-look/current|' snap/gui/hey-look.desktop > /tmp/hey-look.desktop && desktop-file-validate /tmp/hey-look.desktop
          python3 -c 'import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' snap/snapcraft.yaml
          # the metainfo must have a <release> for the app's version (the snap takes its version from it)
          v=$(node -p "require('./package.json').version")
          grep -q "<release version=\"$v\"" linux/io.github.thnonl.HeyLook.metainfo.xml || { echo "::error::linux/io.github.thnonl.HeyLook.metainfo.xml has no <release> for $v (package.json)"; exit 1; }

  snap:
    name: Snap
    needs: metainfo
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: OAuth client ids (tag runs only)
        env:
          GOOGLE_CLIENT_ID: ${{ github.ref_type == 'tag' && secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ github.ref_type == 'tag' && secrets.GOOGLE_CLIENT_SECRET || '' }}
          MICROSOFT_CLIENT_ID: ${{ github.ref_type == 'tag' && secrets.MICROSOFT_CLIENT_ID || '' }}
          MICROSOFT_CLIENT_SECRET: ${{ github.ref_type == 'tag' && secrets.MICROSOFT_CLIENT_SECRET || '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && { [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$MICROSOFT_CLIENT_ID" ]; }; then
            echo "::error::a tag run needs GOOGLE_CLIENT_ID and MICROSOFT_CLIENT_ID in the environment release"
            exit 1
          fi
          umask 077
          {
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "MICROSOFT_CLIENT_ID=$MICROSOFT_CLIENT_ID"
            echo "MICROSOFT_CLIENT_SECRET=$MICROSOFT_CLIENT_SECRET"
          } > .env
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
      - name: Remove the OAuth client ids
        if: always()
        run: rm -f .env
      - name: Review the snap
        run: |
          sudo snap install review-tools
          review-tools.snap-review "${{ steps.build.outputs.snap }}" || true
          ls -l "${{ steps.build.outputs.snap }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
      - name: Upload to the Snap Store
        if: github.ref_type == 'tag' || github.event.inputs.snap_channel != ''
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ github.ref_type == 'tag' && 'candidate' || github.event.inputs.snap_channel }}
