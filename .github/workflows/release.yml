name: Release

# Tag vX.Y.Z (numbers only): build installers for Windows, macOS and Linux, attach them to a draft
# GitHub Release, check the asset names, then publish it as the latest release.
# Manual run (workflow_dispatch) = dry run on the chosen ref: builds all three platforms and keeps the
# bundles as workflow artifacts. It creates no tag and no release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    # Tag runs only. Creates the one draft release that all build jobs upload into.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.mk.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - id: mk
        run: |
          set -euo pipefail
          T="$GITHUB_REF_NAME"
          V="${T#v}"
          # No release or draft may exist for this tag yet.
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "[.[] | select(.tag_name == \"$T\")] | length" | awk '{s+=$1} END {print s+0}')
          if [ "$n" != "0" ]; then
            echo "::error::A release or draft for $T already exists. Delete it first."
            exit 1
          fi
          # Release notes = the CHANGELOG section for this version + the download footer.
          bash .github/scripts/changelog-section.sh "$V" > notes.md
          cat .github/release-footer.md >> notes.md
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                 -f tag_name="$T" -f name="Hey Look! $T" \
                 -F draft=true -F prerelease=false -F body=@notes.md --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Runs after create-release on tag runs, and on its own (create-release skipped) on dry runs.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: macOS (universal)
            platform: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux
            platform: ubuntu-22.04
            args: ""

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The repo files are the source of truth for the version. A tag run fails if they do not match the tag.
      - name: Verify version matches tag
        if: github.event_name == 'push'
        shell: bash
        run: node .github/scripts/verify-version.cjs "${GITHUB_REF_NAME#v}"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Embedded into the binary at build time (see src-tauri/build.rs).
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        with:
          # Upload into the draft made by create-release. Empty on dry runs: build only, upload nothing.
          releaseId: ${{ needs.create-release.outputs.id }}
          releaseAssetNamePattern: "HeyLook_[version]_[platform]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          # No retries while fixing the build (a real compile error would take twice as long); one on tag runs.
          retryAttempts: ${{ github.event_name == 'push' && 1 || 0 }}
          args: ${{ matrix.args }}

      - name: Check ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $app"
          out=$(codesign -dv --verbose=2 "$app" 2>&1) || true
          echo "$out"
          grep -q 'Signature=adhoc' <<<"$out"

  publish:
    # Default success rule on purpose: runs only when create-release and all three builds succeeded.
    needs: [create-release, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check assets
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[].name' > names.txt
          cat names.txt
          bash .github/scripts/check-release-assets.sh "${GITHUB_REF_NAME#v}" < names.txt

      - name: Publish and mark latest
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
