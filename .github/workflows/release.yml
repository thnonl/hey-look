name: Release

# Tag vX.Y.Z (numbers only): build signed installers for Windows, macOS and Linux, attach them to a draft GitHub Release,
# write and check the updater manifest (latest.json), then publish the release as the latest one.
# Manual run (workflow_dispatch) = dry run on the chosen ref: builds the chosen platforms (input `platforms`, default all three)
# and keeps the bundles as workflow artifacts. It creates no tag and no release. A dry run NEVER sees a production secret: the update key,
# the Apple certificate, the OAuth client secrets and the SignPath token belong to the GitHub Environment `release` (deployment rule: v* tags
# only) and every step reads them only on a tag run, so a dry run is built unsigned (update signatures off, macOS ad-hoc signed, no OAuth
# client ids in the app). The signed path (update signatures, macOS self-signed certificate) is exercised by the tag run only.
# With `test_version` (for example 0.9.0) it builds a DEBUG test build of that version (never signed, nothing committed):
# the debug build honours HEYLOOK_UPDATE_ENDPOINT, so it can be pointed at a local latest.json to test the in-app update.
# Use `platforms` there for just the system that is being tested (windows, macos, linux, or a list such as windows,macos).
# Windows signing (SignPath) is OFF unless the repo variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
# SIGNPATH_SIGNING_POLICY_SLUG exist; a dry run signs only with the input `sign_windows` (a signing request needs the owner's approval).
# Microsoft Store (WP14, PACKAGING.md > Microsoft Store). Option A, always when Windows is built (not for a test build): the job `msix` packs the release
# exe into an MSIX with the Windows SDK (unsigned: the Store signs it itself; a copy signed with a throw-away certificate is `msix-test`) and the job
# `msix-check` installs that copy on the disposable runner, starts it and removes it. Neither reads a secret or has an Environment, and neither is needed
# by `publish`: a problem with the Store package never holds back the GitHub release (re-run the failed job). The artifact `msix-store` of a tag run is what the
# owner uploads to Partner Center; it is named `msix-store-NOT-READY` until the app has its packaged mode (src-tauri/msix/readiness.json, WP14 part 2).
# The signed APT repository (job `apt-repo`, Environment `release`, APT_SIGNING_KEY) is OFF as well (DEC-028): it runs only on a tag run with the repository
# variable APT_PUBLISH = true, exactly (the plan job, output apt_publish). Unset, the job is skipped, not red, a tag run does not wait for the signing key,
# and the placeholder-key check of the node tests (DEC-020) is a notice instead of a failure, because nothing is published with that key; with APT_PUBLISH = true
# that check fails a tag run while docs/apt holds the throw-away key. The same holds for the snap in linux-stores.yml (SNAP_PUBLISH = true uploads it).
# Everything that publishes is OFF unless a repository variable says so (DEC-005): `store-submit` (STORE_SUBMIT=true, Environment `store`) sends the MSIX to
# Partner Center; option B (STORE_EXE=true) builds the signed offline installer (`store-exe`), serves it from the website (`store-url`, pages.yml) and
# `store-submit-exe` (both variables) gives Partner Center its address. Without the variables none of these jobs exists in the run, no asset is added and no
# secret is read.
# The node tests run in shards (.github/node-tests.txt): the shard `static` (about 1.5 minutes, the fast gate) always, the UI shards ui-a ... ui-f
# (a headless browser each, about 9 minutes in parallel) on every tag run and, in a dry run, only with the input `ui_tests` (default false).
# A dry run without ui_tests therefore runs plan, static, the Rust tests and the builds; it never publishes, so nothing waits for the UI shards.
# A tag run cannot skip them: the plan job lists them in the matrix of node-tests, and publish needs every shard to have succeeded.
# A tag run always builds all three platforms. The checks that need all three (the asset list, latest.json) exist only in the
# tag run's publish job, so a subset dry run has nothing to skip; the plan job says what was chosen.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      test_version:
        description: "Optional: build a debug TEST build with this version (x.y.z) for updater tests"
        required: false
        default: ""
      platforms:
        description: "Platforms to build: all, or one or more of windows, macos, linux separated by commas (tag runs always build all)"
        required: false
        default: "all"
      sign_windows:
        description: "No effect any more: the SignPath token belongs to the environment release and is only given to tag runs"
        required: false
        default: "false"
      rehearse_signing:
        description: "Rehearse the signed path with throw-away keys made inside the run (update key, macOS certificate), thrown away at its end. No production secret is read. Ignored on a tag run and with test_version. Do not install the files of such a run"
        type: boolean
        required: false
        default: false
      ui_tests:
        description: "Also run the UI test shards (ui-a ... ui-f, about 9 minutes, a headless browser each). Off: only the fast shard static, the Rust tests and the builds. Tag runs always run them"
        type: boolean
        required: false
        default: false

# Least privilege: read-only by default; every job that needs more says so itself.
permissions:
  contents: read

env:
  # The Rust compiler of every build and test job, exactly. A new Rust release must not change the shipped binary between the
  # last dry run and the tag run. To bump: change it here, run a dry run (platforms=all, all 823+ cargo tests and the three builds must
  # pass), run `cargo report future-incompatibilities` and, if a lint of imap-proto 0.10.2 (a trailing semicolon in macros, pulled in by the vendored imap) is
  # becoming an error, vendor imap-proto under src-tauri/vendor/ with the semicolon fix (as imap is) BEFORE the bump, commit. rustfmt and clippy are not used in CI,
  # so no components are installed. The Rust test jobs run with RUSTFLAGS -D warnings.
  RUST_VERSION: "1.99.1"
  # The runner images, exactly (W11.8). No job uses a `-latest` label: the image must not change between the last dry run and the tag run (the publish
  # job runs only on a tag, so with `ubuntu-latest` its first run on a new image would have been the release itself). In use: ubuntu-24.04 (plan,
  # create-release, publish, the website deploy of pages.yml), windows-2025-vs2026 (every Windows job; the label of the image that windows-latest was),
  # macos-26 (arm64, the universal build), ubuntu-22.04 (node tests, Rust tests, Linux build: the glibc floor of the Linux packages). To change one:
  # change the label, then a dry run platforms=all AND a rehearsal (rehearse_signing=true), both green, then commit. scripts/test-release-workflow.mjs fails on a `-latest` label.
  #
  # SHA-1 fingerprint of the project's self-signed macOS certificate, the same since 1.0.6 (a public fingerprint, not a secret). A tag run fails when the
  # signed app carries another certificate: every Mac's Keychain would ask about the saved passwords again. If the certificate is replaced on purpose,
  # change this value in the same commit as the secrets (CONTRIBUTING.md > Signing and notarisation).
  MAC_CERT_SHA1: "57b25c63435370e97149c84086474b6d2f51e448"

# One run per ref and kind at a time. A newer manual run of the same kind (and the same platforms) on the same ref cancels the one
# that is still building; a tag run is never cancelled.
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name == 'push' && 'tag' || format('{0}-{1}-{2}', github.event.inputs.test_version != '' && 'test' || 'dry', github.event.inputs.platforms, github.event.inputs.rehearse_signing == 'true' && 'rehearse' || 'plain') }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  plan:
    # Which platforms to build: a tag run builds all three; a manual run builds what `platforms` names.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      signpath: ${{ steps.plan.outputs.signpath }}
      tests: ${{ steps.plan.outputs.tests }}
      shards: ${{ steps.plan.outputs.shards }}
      ui_tests: ${{ steps.plan.outputs.ui_tests }}
      msix: ${{ steps.plan.outputs.msix }}
      rehearse: ${{ steps.plan.outputs.rehearse }}
      wintests: ${{ steps.plan.outputs.wintests }}
      store_exe: ${{ steps.plan.outputs.store_exe }}
      store_submit: ${{ steps.plan.outputs.store_submit }}
      apt_publish: ${{ steps.plan.outputs.apt_publish }}
    steps:
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          TEST_VERSION: ${{ github.event.inputs.test_version }}
          UI_TESTS: ${{ github.event.inputs.ui_tests }}
          REHEARSE: ${{ github.event.inputs.rehearse_signing }}
          SIGN_DRY_RUN: ${{ github.event.inputs.sign_windows }}
          SP_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SP_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SP_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          REQUIRE_WIN: ${{ vars.REQUIRE_WIN_SIGNING }}
          STORE_EXE: ${{ vars.STORE_EXE }}
          STORE_SUBMIT: ${{ vars.STORE_SUBMIT }}
          APT_PUBLISH: ${{ vars.APT_PUBLISH }}
        run: |
          set -euo pipefail
          want="all"
          if [ "$EVENT" = "workflow_dispatch" ]; then want="$(echo "${PLATFORMS:-all}" | tr 'A-Z' 'a-z' | tr -d ' ')"; fi
          [ -n "$want" ] || want="all"
          win=false; mac=false; lin=false
          IFS=',' read -ra parts <<< "$want"
          for p in "${parts[@]}"; do
            case "$p" in
              all) win=true; mac=true; lin=true ;;
              windows) win=true ;;
              macos) mac=true ;;
              linux) lin=true ;;
              *) echo "::error::Unknown platform '$p'. Use all, windows, macos, linux or a comma list."; exit 1 ;;
            esac
          done
          items=()
          $win && items+=('{"name":"Windows","platform":"windows-2025-vs2026","args":""}')
          $mac && items+=('{"name":"macOS (universal)","platform":"macos-26","args":"--target universal-apple-darwin"}')
          $lin && items+=('{"name":"Linux","platform":"ubuntu-22.04","args":""}')
          matrix="{\"include\":[$(IFS=,; echo "${items[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # the node tests ran in the Linux build job before: they run whenever Linux is built
          echo "tests=$lin" >> "$GITHUB_OUTPUT"
          # the Rust tests of Windows (W11.9): they have #[cfg(windows)] tests that the Linux job cannot run; they run whenever Windows is built
          echo "wintests=$win" >> "$GITHUB_OUTPUT"
          # the signing rehearsal (W11.3): a manual run that asks for it; a tag run and a test build ignore it
          rehearse=false
          if [ "$REHEARSE" = "true" ]; then
            if [ "$EVENT" = "push" ]; then echo "::notice::rehearse_signing is ignored on a tag run"
            elif [ -n "$TEST_VERSION" ]; then echo "::notice::rehearse_signing is ignored for a test build"
            else rehearse=true; echo "::notice::REHEARSAL: the update key and the macOS certificate are throw-away keys made in this run. Do not install the files of this run."; fi
          fi
          echo "rehearse=$rehearse" >> "$GITHUB_OUTPUT"
          # the shards of the node-tests job: static always; the UI shards on a tag run (never skippable there) or when a dry run asks for them.
          # The names must be the shard words of .github/node-tests.txt (scripts/check-shards.mjs, run by the shard static, compares them).
          ui_shards='ui-a ui-b ui-c ui-d ui-e ui-f'
          ui=false
          if [ "$EVENT" = "push" ] || [ "$UI_TESTS" = "true" ]; then ui=true; fi
          shards='["static"'
          if [ "$ui" = true ]; then for s in $ui_shards; do shards="$shards,\"$s\""; done; fi
          shards="$shards]"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "ui_tests=$ui" >> "$GITHUB_OUTPUT"
          echo "Node test shards: $shards"
          echo "Event: $EVENT. Platforms to build: $want"
          echo "$matrix"
          if [ "${#items[@]}" -lt 3 ]; then
            echo "::notice::Subset run: only some platforms are built. A tag run always builds all three; the asset-list and latest.json checks run only there."
          fi
          # Windows signing with SignPath: only with all three SIGNPATH_* variables, never for a test build, on a tag run or a dry run that asks for it.
          signpath=false
          sp_set=0
          [ -z "$SP_ORG" ] || sp_set=$((sp_set + 1))
          [ -z "$SP_PROJECT" ] || sp_set=$((sp_set + 1))
          [ -z "$SP_POLICY" ] || sp_set=$((sp_set + 1))
          if [ "$sp_set" -eq 3 ]; then
            if [ "$win" = true ] && [ -z "$TEST_VERSION" ] && { [ "$EVENT" = "push" ] || [ "$SIGN_DRY_RUN" = "true" ]; }; then signpath=true; fi
          elif [ "$sp_set" -gt 0 ]; then
            echo "::warning::Only part of SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG is set: Windows signing is off"
          fi
          if [ "$EVENT" = "push" ] && [ "$REQUIRE_WIN" = "true" ] && [ "$signpath" != "true" ]; then
            echo "::error::REQUIRE_WIN_SIGNING is true but Windows signing is not configured (the three SIGNPATH_* variables)"
            exit 1
          fi
          echo "signpath=$signpath" >> "$GITHUB_OUTPUT"
          echo "Windows signing with SignPath: $signpath"
          # Microsoft Store (WP14). The MSIX package (option A) is made whenever Windows is built, except for a test build (its exe is a debug build).
          msix=false
          if [ "$win" = true ] && [ -z "$TEST_VERSION" ]; then msix=true; fi
          # Option B (the signed offline EXE installer for the Store) is built but OFF (DEC-005): only the repository variable STORE_EXE=true, exactly,
          # turns it on. A dry run then builds it and keeps it as an artifact; a tag run attaches it to the release and serves it from the website.
          store_exe=false
          if [ "$msix" = true ] && [ "$STORE_EXE" = "true" ]; then store_exe=true; fi
          # The submission to Partner Center (Entra application) is built but OFF (DEC-005): tag runs with STORE_SUBMIT=true, exactly.
          store_submit=false
          if [ "$EVENT" = "push" ] && [ "$STORE_SUBMIT" = "true" ]; then store_submit=true; fi
          echo "msix=$msix" >> "$GITHUB_OUTPUT"
          echo "store_exe=$store_exe" >> "$GITHUB_OUTPUT"
          echo "store_submit=$store_submit" >> "$GITHUB_OUTPUT"
          echo "Microsoft Store: MSIX package $msix, EXE installer (STORE_EXE) $store_exe, submission (STORE_SUBMIT) $store_submit"
          # The signed APT repository (DEC-028) is OFF: only a tag run with the repository variable APT_PUBLISH=true, exactly, makes and publishes it.
          # The job apt-repo and the strictness of the placeholder-key check in node-tests both follow this one output.
          apt_publish=false
          if [ "$EVENT" = "push" ] && [ "$APT_PUBLISH" = "true" ]; then apt_publish=true; fi
          echo "apt_publish=$apt_publish" >> "$GITHUB_OUTPUT"
          echo "APT repository (APT_PUBLISH): $apt_publish"

  create-release:
    # Tag runs only. Creates the one draft release that all build jobs upload into.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the draft release
    outputs:
      id: ${{ steps.mk.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: mk
        run: |
          set -euo pipefail
          T="$GITHUB_REF_NAME"
          V="${T#v}"
          # No release or draft may exist for this tag yet.
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "[.[] | select(.tag_name == \"$T\")] | length" | awk '{s+=$1} END {print s+0}')
          if [ "$n" != "0" ]; then
            echo "::error::A release or draft for $T already exists. Delete it first."
            exit 1
          fi
          # Release notes = the CHANGELOG section for this version + the download footer.
          bash .github/scripts/changelog-section.sh "$V" > notes.md
          cat .github/release-footer.md >> notes.md
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                 -f tag_name="$T" -f name="Hey Look! $T" \
                 -F draft=true -F prerelease=false -F body=@notes.md --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  node-tests:
    # The node tests (scripts/test-*.mjs and the other node checks, listed in .github/node-tests.txt) used to run inside the Linux build job, one
    # after the other, in front of the installer build. They need no Rust and no installer, so they run beside the three builds, in shards
    # (the list says which test is in which shard) on the same image as before. All shards must pass before anything is signed or published.
    # The plan job decides which shards exist: a dry run without the input ui_tests has only `static` (this job is then green after it), a tag
    # run and a dry run with ui_tests have static and ui-a ... ui-f. The result of this job is the result of all its shards, so publish, which
    # needs `success`, can never go on with a UI shard failed; and a tag run has no way to leave a shard out.
    needs: plan
    if: ${{ needs.plan.outputs.tests == 'true' }}
    name: Node tests (${{ matrix.shard }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # DEC-020, DEC-028: until the owner's real APT signing key is committed (docs/apt), scripts/test-site-apt.mjs fails on the throw-away key. It may go on
      # with a notice whenever no APT repository is published by this run (every run but a tag run with APT_PUBLISH=true: dry runs, branch runs and the tag
      # run of a release without APT stay green); a run that publishes the repository never does, and publish needs this job. Set here and nowhere else
      # (scripts/test-apt-placeholder-guard.mjs): not in pages.yml, not in .github/node-tests.txt. (The value is written so that a falsy-looking '0'
      # never has to be the result of an && chain.)
      APT_ALLOW_PLACEHOLDER_KEY: ${{ needs.plan.outputs.apt_publish != 'true' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # same files as the Linux build of a test build sees
      - name: Set test version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_version != ''
        env:
          TEST_VERSION: ${{ github.event.inputs.test_version }}
        run: node .github/scripts/set-version.cjs "$TEST_VERSION"

      - run: npm ci

      - name: Run the tests of this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/run-node-tests.sh "$SHARD"

  rust-tests:
    # `cargo test` of src-tauri (112 test modules: i18n, capabilities, test bridge, calendar sync, outbox, mail parsing ...). CI never ran them
    # before; the release checklist only names them. Same image and system packages as the Linux build. The frontend is not needed to compile
    # the tests, but the app macro wants the folder of the built frontend to exist, so an empty stand-in is made.
    needs: plan
    if: ${{ needs.plan.outputs.tests == 'true' }}
    name: Rust tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The .deb files of the system packages are cached (a slow Ubuntu mirror took 1542 s for this step in two dry runs, the same step took 24 s
      # in another job). The cache only protects against a slow mirror: the first run on a new key still downloads, and a hit installs from the
      # cached files without apt-get update. See .github/scripts/install-linux-deps.sh.
      - name: Apt cache key
        id: aptkey
        run: echo "image=${ImageVersion:-unknown}-$(lsb_release -rs 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: aptcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.image }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}-v1
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.image }}-

      - name: Install Linux dependencies
        run: bash .github/scripts/install-linux-deps.sh

      - name: Save the apt package cache
        if: steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.image }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}-v1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (a SHA pin needs the toolchain named)
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # W11.5: only main and the release branches save a cache (about 3.5 GB each, under the 10 GB the repository may keep); a feature branch and a tag
          # only restore, from main, the nearest key (a feature-branch dry run therefore starts from the Rust dependencies of main, which may be older).
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      - name: Run cargo test
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
          # W9.8: a warning of this crate (or of the vendored imap) fails the job; registry crates keep cargo's --cap-lints, so their warnings never do
          RUSTFLAGS: "-D warnings"
        run: |
          mkdir -p ../dist
          [ -e ../dist/index.html ] || echo '<!doctype html><title>stand-in</title>' > ../dist/index.html
          cargo test --locked

  audit:
    # Dependency audit (W9.11): known vulnerabilities in the npm and Cargo dependencies. A high or critical npm advisory in a production dependency, and
    # any RustSec vulnerability in src-tauri/Cargo.lock, stop the run (an "unmaintained" or "yanked" notice is printed, it does not). An advisory that must
    # stay is listed with its reason in src-tauri/.cargo/audit.toml (ignore = [...]), never skipped here. The full npm audit is printed for the record.
    needs: plan
    if: ${{ needs.plan.outputs.tests == 'true' }}
    name: Dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: npm audit (production dependencies, high and critical stop the run)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (everything, for the record)
        run: npm audit || true

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  rust-tests-windows:
    # `cargo test` on Windows (W11.9): the #[cfg(windows)] tests (webview_health with a real WebView2, winframe, the Windows notification code ...) never ran in CI
    # because the Rust job above is Linux only. Same Rust version and cache rules as the other Rust jobs; runs beside the builds, so the wall time of the run
    # does not grow (it must not take longer than the macOS build). The frontend is not needed to compile the tests: an empty stand-in folder is made.
    needs: plan
    if: ${{ needs.plan.outputs.wintests == 'true' }}
    name: Rust tests (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (a SHA pin needs the toolchain named)
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # W11.5: only main and the release branches save a cache; a feature branch and a tag only restore
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      - name: Run cargo test
        shell: bash
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
          RUSTFLAGS: "-D warnings" # (W9.8, as the Linux job)
        run: |
          mkdir -p ../dist
          [ -e ../dist/index.html ] || echo '<!doctype html><title>stand-in</title>' > ../dist/index.html
          cargo test --locked

  build:
    needs: [plan, create-release]
    # Runs after create-release on tag runs, and on its own (create-release skipped) on dry runs.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    # a cold-cache tag build of the macOS universal app takes about 24 minutes; a hung job must not run for the 6 hour default
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write # tauri-action uploads the installers into the draft release (tag runs only; a job cannot ask for this per event)

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the token must not stay in .git/config where npm scripts and tests could read it

      # The .deb files of the system packages are cached (a slow Ubuntu mirror took 1542 s for this step in two dry runs, the same step took 24 s
      # in another job). The cache only protects against a slow mirror: the first run on a new key still downloads, and a hit installs from the
      # cached files without apt-get update. See .github/scripts/install-linux-deps.sh.
      - name: Apt cache key
        id: aptkey
        if: runner.os == 'Linux'
        run: echo "image=${ImageVersion:-unknown}-$(lsb_release -rs 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: aptcache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.image }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}-v1
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.image }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-deps.sh

      - name: Save the apt package cache
        if: runner.os == 'Linux' && steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.image }}-${{ hashFiles('.github/scripts/install-linux-deps.sh') }}-v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (a SHA pin needs the toolchain named)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # W11.5: only main and the release branches save a cache (about 3.5 GB each, under the 10 GB the repository may keep); a feature branch and a tag
          # only restore, from main, the nearest key (a feature-branch dry run therefore starts from the Rust dependencies of main, which may be older).
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      # Is there a signing key? Tag run: it must be there. Dry run: signed with it, or built unsigned (with a warning) without.
      # A test build (test_version) is never signed. The key itself is never printed.
      - name: Signing key
        id: sign
        shell: bash
        env:
          KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TEST_VERSION: ${{ github.event.inputs.test_version }}
          EVENT: ${{ github.event_name }}
          REHEARSE: ${{ needs.plan.outputs.rehearse }}
        run: |
          NOUPD="--config src-tauri/tauri.no-updater.conf.json"
          if [ "$EVENT" = "push" ]; then
            if [ -z "$KEY" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: a release must be signed"
              exit 1
            fi
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "pubkey=error" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "profile=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$TEST_VERSION" ]; then
            echo "Test build $TEST_VERSION (debug, no updater artifacts)"
            echo "extra=--debug $NOUPD" >> "$GITHUB_OUTPUT"
            echo "pubkey=error" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "profile=debug" >> "$GITHUB_OUTPUT"
          elif [ "$REHEARSE" = "true" ]; then
            # W11.3: signed with a throw-away key made after npm ci (step "Rehearsal: throw-away update key"); the real files and steps run, the key is not the release key
            echo "::notice::Rehearsal: the update packages are signed with a throw-away key"
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "pubkey=error" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "profile=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "pubkey=error" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "profile=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Unsigned dry run: TAURI_SIGNING_PRIVATE_KEY is not set"
            echo "extra=$NOUPD" >> "$GITHUB_OUTPUT"
            echo "pubkey=warn" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "profile=release" >> "$GITHUB_OUTPUT"
          fi

      # A tag run without the OAuth client ids would ship an app that cannot sign in to Google / Microsoft. The ids are embedded at build
      # time (src-tauri/build.rs). Names only, values are never printed.
      # W11.2: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and MICROSOFT_CLIENT_ID are required (the Google sign-in needs the secret too); MICROSOFT_CLIENT_SECRET is
      # optional (a public client). The script is .github/scripts/check-oauth-env.sh (its --selftest is in the shard static).
      - name: OAuth client ids present (tag runs)
        if: github.event_name == 'push'
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ github.event_name == 'push' && secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.GOOGLE_CLIENT_SECRET || '' }}
          MICROSOFT_CLIENT_ID: ${{ github.event_name == 'push' && secrets.MICROSOFT_CLIENT_ID || '' }}
          MICROSOFT_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.MICROSOFT_CLIENT_SECRET || '' }}
        run: bash .github/scripts/check-oauth-env.sh

      # Test build only: the version of this checkout is changed (never committed).
      - name: Set test version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_version != ''
        shell: bash
        env:
          TEST_VERSION: ${{ github.event.inputs.test_version }}
        run: node .github/scripts/set-version.cjs "$TEST_VERSION"

      # The repo files are the source of truth for the version: a tag run fails if they do not match the tag.
      # The updater public key must be in tauri.conf.json (warning only for an unsigned dry run).
      - name: Verify version and updater key
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUBKEY: ${{ steps.sign.outputs.pubkey }}
        run: |
          if [ "$EVENT" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="-"; fi
          node .github/scripts/verify-version.cjs "$V" . --pubkey="$PUBKEY"

      - run: npm ci

      # W11.3 Rehearsal (manual run with rehearse_signing=true): the update key is made here, with the project's own tauri CLI, and thrown away with the runner.
      # Its PUBLIC half replaces plugins.updater.pubkey in this checkout's tauri.conf.json (never committed), its private half and password go to the build
      # step through the job's environment. No production secret is read anywhere in this block. Installers of such a run trust a key that no longer exists,
      # so their updater refuses every update offer.
      - name: "Rehearsal: throw-away update key"
        if: needs.plan.outputs.rehearse == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          keyfile="$RUNNER_TEMP/rehearse-updater.key"
          npx --no-install tauri signer generate --ci -p "$pw" -w "$keyfile"
          key="$(tr -d '\r\n' < "$keyfile")"
          echo "::add-mask::$key"
          PUB="$(tr -d '\r\n' < "$keyfile.pub")" node -e 'const f="src-tauri/tauri.conf.json",c=JSON.parse(require("fs").readFileSync(f,"utf8"));c.plugins.updater.pubkey=process.env.PUB;require("fs").writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          { echo "REHEARSAL_TAURI_KEY=$key"; echo "REHEARSAL_TAURI_KEY_PASSWORD=$pw"; } >> "$GITHUB_ENV"
          echo "A throw-away update key was made (the public half is in this checkout's tauri.conf.json only)."

      # W11.3 macOS: a throw-away self-signed code-signing certificate (extended key usage codeSigning), fed to the SAME "macOS signing" branch as the real
      # secrets (mac-import-selfsigned.sh, then "Check self-signed signature"). The identity pin of MAC_CERT_SHA1 is not applied in a rehearsal.
      - name: "Rehearsal: throw-away macOS certificate"
        if: needs.plan.outputs.rehearse == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          name="Hey Look rehearsal $GITHUB_RUN_ID"
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          cnf="$RUNNER_TEMP/rehearse-cert.cnf"
          printf '%s\n' '[req]' 'distinguished_name = dn' 'x509_extensions = ext' 'prompt = no' '[dn]' "CN = $name" '[ext]' 'basicConstraints = critical,CA:false' 'keyUsage = critical,digitalSignature' 'extendedKeyUsage = critical,codeSigning' > "$cnf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -config "$cnf" -keyout "$RUNNER_TEMP/rehearse-cert.key" -out "$RUNNER_TEMP/rehearse-cert.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/rehearse-cert.key" -in "$RUNNER_TEMP/rehearse-cert.pem" -out "$RUNNER_TEMP/rehearse-cert.p12" -passout "pass:$pw"
          cert="$(openssl base64 -A < "$RUNNER_TEMP/rehearse-cert.p12")"
          echo "::add-mask::$cert"
          rm -f "$RUNNER_TEMP/rehearse-cert.key" "$RUNNER_TEMP/rehearse-cert.pem" "$RUNNER_TEMP/rehearse-cert.p12" "$cnf"
          { echo "REHEARSAL_APPLE_CERTIFICATE=$cert"; echo "REHEARSAL_APPLE_CERTIFICATE_PASSWORD=$pw"; echo "REHEARSAL_APPLE_SIGNING_IDENTITY=$name"; } >> "$GITHUB_ENV"
          echo "A throw-away signing certificate was made: $name"

      # macOS code signing (owner steps: CONTRIBUTING.md > Signing and notarisation). Only when the three certificate secrets
      # (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY) exist and this is not a test build; otherwise nothing
      # changes: no APPLE_* variable is set (an EMPTY variable is not an unset one for the bundler, so they go through GITHUB_ENV only
      # now) and the app stays ad-hoc signed as before. Two kinds of certificate, told apart by the identity name:
      #   - the project's self-signed certificate (today; any name that is not "Developer ID Application..."): signed, not notarised.
      #     Its only purpose is a fixed signing identity across updates (the Keychain keeps its permission). Imported by
      #     .github/scripts/mac-import-selfsigned.sh, checked after the build by .github/scripts/mac-verify-selfsigned.sh.
      #   - an Apple "Developer ID Application" certificate (later, paid account): the bundler imports it and signs; with notarisation
      #     credentials (App Store Connect API key APPLE_API_*, or APPLE_ID, APPLE_PASSWORD + variable APPLE_TEAM_ID) it notarises too.
      # Variable REQUIRE_MAC_SIGNING=true (set at go-live of Developer ID) makes a tag run fail when it would not be signed with a
      # Developer ID certificate and notarised, or when a group of secrets is only partly set; without it a partly set group is a
      # warning that names the missing secrets.
      # This step is the last one before the build on purpose: npm ci and the node scripts never see these secrets. The step after
      # the build ("Remove Apple signing material") deletes the key file and keychain and empties the variables again.
      - name: macOS signing
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TEST_VERSION: ${{ github.event.inputs.test_version }}
          REQUIRE: ${{ vars.REQUIRE_MAC_SIGNING }}
          # a rehearsal (W11.3) gives the same three names throw-away values from the step before; no secret is read outside the push gate
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE || env.REHEARSAL_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE_PASSWORD || env.REHEARSAL_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || env.REHEARSAL_APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.APPLE_API_PRIVATE_KEY || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "notarize=false" >> "$GITHUB_OUTPUT"
          if [ -n "$TEST_VERSION" ]; then echo "Test build: ad-hoc signed"; exit 0; fi
          strict=false
          if [ "$EVENT" = "push" ] && [ "$REQUIRE" = "true" ]; then strict=true; fi
          # a problem is an error in strict mode (the run stops here, before any secret is exported), a warning otherwise
          problem() {
            if [ "$strict" = true ]; then echo "::error::REQUIRE_MAC_SIGNING is true but $1"; exit 1; fi
            echo "::warning::$1"
          }
          # the names (never the values) of the empty ones among the named variables
          missing() {
            local m="" n
            for n in "$@"; do if [ -z "${!n}" ]; then m="$m $n"; fi; done
            echo "${m# }"
          }
          # appends NAME=value to GITHUB_ENV in the multi-line form, so a value with a line break cannot add another variable
          setenv() {
            local d="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >> "$GITHUB_ENV"
          }
          cert_missing=$(missing APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY)
          if [ -n "$cert_missing" ] && [ "$EVENT" = push ]; then
            # the secrets live in the environment `release`; one that was forgotten there would otherwise ship an ad-hoc signed app, which
            # changes the signing identity of the app (and makes the Keychain ask again)
            echo "::error::tag run without the full macOS signing secrets (missing: $cert_missing). Add them to the environment 'release'."
            exit 1
          fi
          if [ -n "$cert_missing" ]; then
            if [ "$cert_missing" = "APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY" ]; then
              if [ "$strict" = true ]; then problem "the Apple signing secrets are not all set"; fi
              echo "::notice::No Apple signing secrets: the macOS app is ad-hoc signed (not notarised)"
            else
              problem "the Apple signing secrets are only partly set, missing: $cert_missing. The macOS app is ad-hoc signed (not notarised)"
            fi
            exit 0
          fi
          # the bundler takes the identity from the config first: "-" (ad-hoc) in the repo file becomes the real one in this checkout only
          use_identity() {
            node -e 'const f="src-tauri/tauri.conf.json",c=JSON.parse(require("fs").readFileSync(f,"utf8"));c.bundle.macOS.signingIdentity=process.env.APPLE_SIGNING_IDENTITY;require("fs").writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          }
          # Which certificate? A "Developer ID Application: ..." one (Apple's; the bundler imports it, notarisation follows) or any
          # other name = the project's own self-signed one. The self-signed one is imported here, not by the bundler: the bundler only
          # accepts certificates whose name starts with an Apple prefix and that carry a Team ID (see mac-import-selfsigned.sh).
          # It is not notarised (Gatekeeper still asks for "Open Anyway") but the signature names the certificate, so the app keeps
          # the same identity in every release and the macOS Keychain keeps its permission for the saved passwords across updates.
          # Rotation (a new self-signed certificate, or the Developer ID one): CONTRIBUTING.md > Signing and notarisation.
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application"*) kind=developer-id ;;
            *) kind=self-signed ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = self-signed ]; then
            if [ "$strict" = true ]; then
              echo "::error::REQUIRE_MAC_SIGNING is true but the certificate \"$APPLE_SIGNING_IDENTITY\" is self-signed (no Developer ID, no notarisation)"
              exit 1
            fi
            if [ -n "$APPLE_API_KEY$APPLE_ID" ]; then
              echo "::warning::Notarisation settings exist but the certificate is self-signed: Apple cannot notarise it, they are not used"
            fi
            bash .github/scripts/mac-import-selfsigned.sh
            use_identity
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The macOS app is signed with the self-signed certificate \"$APPLE_SIGNING_IDENTITY\" (not notarised)"
            exit 0
          fi
          if [ -z "$APPLE_TEAM_ID" ]; then
            problem "the repo variable APPLE_TEAM_ID is not set; the check after the build compares the Team ID of the signature with it"
          fi
          # notarisation: the API key trio, else the Apple ID trio; a trio that is only partly set is named
          api_missing=$(missing APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY)
          id_missing=$(missing APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          notarize=none
          if [ -z "$api_missing" ]; then notarize=api; elif [ -z "$id_missing" ]; then notarize=appleid; fi
          if [ "$notarize" = none ]; then
            if [ "$api_missing" != "APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY" ]; then
              problem "the notarisation API key secrets are only partly set, missing: $api_missing"
            fi
            if [ -n "$APPLE_ID$APPLE_PASSWORD" ] && [ -n "$id_missing" ]; then
              problem "the Apple ID notarisation settings are only partly set, missing: $id_missing"
            fi
            problem "the app would be signed but not notarised (no complete APPLE_API_* or APPLE_ID trio), and Gatekeeper still blocks such an app"
          fi
          # the certificate as one line; the cleaned text differs from the stored secret, so it is masked on its own
          cleaned=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d ' \r\n')
          echo "::add-mask::$cleaned"
          setenv APPLE_CERTIFICATE "$cleaned"
          setenv APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          setenv APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          use_identity
          echo "signed=true" >> "$GITHUB_OUTPUT"
          if [ "$notarize" = api ]; then
            umask 077
            keyfile="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$keyfile"
            setenv APPLE_API_ISSUER "$APPLE_API_ISSUER"
            setenv APPLE_API_KEY "$APPLE_API_KEY"
            setenv APPLE_API_KEY_PATH "$keyfile"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          elif [ "$notarize" = appleid ]; then
            setenv APPLE_ID "$APPLE_ID"
            setenv APPLE_PASSWORD "$APPLE_PASSWORD"
            setenv APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Embedded into the binary at build time (see src-tauri/build.rs).
          GOOGLE_CLIENT_ID: ${{ github.event_name == 'push' && secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.GOOGLE_CLIENT_SECRET || '' }}
          MICROSOFT_CLIENT_ID: ${{ github.event_name == 'push' && secrets.MICROSOFT_CLIENT_ID || '' }}
          MICROSOFT_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.MICROSOFT_CLIENT_SECRET || '' }}
          # Signs the update packages (minisign). Only this step gets the key.
          # (a rehearsal, W11.3, gives it the throw-away key of the step "Rehearsal: throw-away update key")
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || env.REHEARSAL_TAURI_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || env.REHEARSAL_TAURI_KEY_PASSWORD }}
          # The .deb names the Ayatana tray library (libayatana-appindicator3-1: Debian 12 and Ubuntu have it, libappindicator3-1 is gone from Debian 12).
          # The bundler takes it from the dev package it finds (install-linux-deps.sh); this makes the choice explicit. Checked after the build.
          TAURI_LINUX_AYATANA_APPINDICATOR: "true"
        with:
          # Upload into the draft made by create-release. Empty on dry runs: build only, upload nothing.
          releaseId: ${{ needs.create-release.outputs.id }}
          releaseAssetNamePattern: "HeyLook_[version]_[platform]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          # No retries while fixing the build (a real compile error would take twice as long); one on tag runs.
          retryAttempts: ${{ github.event_name == 'push' && 1 || 0 }}
          args: ${{ matrix.args }} ${{ steps.sign.outputs.extra }}

      # The Apple secrets live only from "macOS signing" to here: the key file and keychain go, the variables are emptied for every later step.
      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS' && steps.apple.outputs.signed == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/heylook-signing.p12 "$RUNNER_TEMP"/heylook-signing.pem
          # the self-signed certificate's keychain, and the bundler's temporary one (a hosted runner is thrown away anyway)
          security delete-keychain "$RUNNER_TEMP/heylook-signing.keychain-db" 2>/dev/null || true
          { security list-keychains -d user | tr -d '" ' | grep -i tauri | while read -r k; do security delete-keychain "$k" || true; done; } || true
          for n in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH APPLE_ID APPLE_PASSWORD; do
            echo "$n=" >> "$GITHUB_ENV"
          done

      # A release app must be a GUI program: with the console subsystem Windows opens a black console window beside it.
      - name: The Windows app is a GUI program
        if: runner.os == 'Windows' && steps.sign.outputs.profile == 'release'
        shell: bash
        run: |
          node .github/scripts/check-pe-subsystem.cjs --selftest
          node .github/scripts/check-pe-subsystem.cjs src-tauri/target/release/hey-look.exe --expect gui

      # WP14: the exe of this build goes into the Microsoft Store package (job msix) byte for byte; the sha256 is on both run summaries.
      - name: Keep hey-look.exe for the Store package
        if: runner.os == 'Windows' && needs.plan.outputs.msix == 'true' && steps.sign.outputs.profile == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-exe
          path: src-tauri/target/release/hey-look.exe
          retention-days: 1
          if-no-files-found: error

      # The test bridge (src-tauri/src/testbridge/, a remote control of the windows for QA) exists in debug builds only: the built release app
      # must not contain it. Searched for the name of its environment variable (and its log text): the binaries, the macOS .app, and the
      # unpacked .deb on Linux (the other bundles are compressed, they hold the same binary).
      - name: No test bridge in the release app
        if: steps.sign.outputs.profile == 'release'
        shell: bash
        run: |
          node .github/scripts/check-no-test-bridge.cjs --selftest
          targets=()
          for f in src-tauri/target/release/hey-look src-tauri/target/release/hey-look.exe src-tauri/target/*-apple-darwin/release/hey-look; do
            # (Git Bash on Windows reports the extensionless name as a file because hey-look.exe exists: skip it there)
            if [ -f "$f" ]; then case "$RUNNER_OS:$f" in Windows:*/hey-look) ;; *) targets+=("$f") ;; esac; fi
          done
          for d in src-tauri/target/release/bundle/macos src-tauri/target/universal-apple-darwin/release/bundle/macos; do
            if [ -d "$d" ]; then targets+=("$d"); fi
          done
          if [ "$RUNNER_OS" = "Linux" ]; then
            mkdir deb-unpacked
            for deb in src-tauri/target/release/bundle/deb/*.deb; do dpkg-deb -x "$deb" deb-unpacked; done
            targets+=(deb-unpacked)
          fi
          echo "searching: ${targets[*]}"
          node .github/scripts/check-no-test-bridge.cjs "${targets[@]}"

      # WP15: the .deb must depend on the Ayatana tray library, not on libappindicator3-1 (which Debian 12 does not have). The APT repository
      # (jobs apt-repo and apt-repo-dryrun) installs it on Debian 12 as well.
      - name: The .deb depends on the Ayatana tray library
        if: runner.os == 'Linux' && steps.sign.outputs.profile == 'release'
        shell: bash
        run: |
          set -euo pipefail
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            deps=$(dpkg-deb -f "$deb" Depends)
            echo "$(basename "$deb"): Depends: $deps"
            case ",$deps," in *"libayatana-appindicator3-1"*) ;; *) echo "::error::the .deb does not depend on libayatana-appindicator3-1"; exit 1 ;; esac
            case ",$deps," in *"libappindicator3-1"*) echo "::error::the .deb still depends on libappindicator3-1"; exit 1 ;; esac
          done

      # Every update signature must belong to the file next to it (public key = plugins.updater.pubkey of tauri.conf.json). The same
      # check runs again in the publish job on the files of the draft release, which is the one that decides.
      - name: Verify the update signatures
        if: steps.sign.outputs.signed == 'true'
        shell: bash
        run: |
          dirs=()
          for d in src-tauri/target/release/bundle src-tauri/target/universal-apple-darwin/release/bundle; do
            if [ -d "$d" ]; then dirs+=("$d"); fi
          done
          case "$RUNNER_OS" in Windows) min=2 ;; Linux) min=3 ;; *) min=1 ;; esac
          node .github/scripts/verify-update-sigs.cjs --conf src-tauri/tauri.conf.json --min "$min" "${dirs[@]}"

      # SignPath signs after the build (the sign-windows job): the unsigned installers go there as a workflow artifact.
      - name: Keep the unsigned Windows installers for SignPath
        if: runner.os == 'Windows' && needs.plan.outputs.signpath == 'true' && steps.sign.outputs.profile == 'release'
        shell: bash
        run: |
          mkdir unsigned
          cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi unsigned/
          ls -l unsigned

      - name: Upload the unsigned Windows installers
        if: runner.os == 'Windows' && needs.plan.outputs.signpath == 'true' && steps.sign.outputs.profile == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned
          path: unsigned/*
          retention-days: 1
          if-no-files-found: error

      # tauri-action keeps only the installers as workflow artifacts: keep the updater signatures of a dry run too, and the
      # macOS update package (.app.tar.gz, not an installer artifact) that its signature belongs to
      - name: Keep the signatures of a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signatures-${{ runner.os }}
          path: |
            src-tauri/target/**/bundle/**/*.sig
            src-tauri/target/**/bundle/macos/*.app.tar.gz
          if-no-files-found: ${{ steps.sign.outputs.signed == 'true' && 'error' || 'ignore' }}
          retention-days: 1

      - name: Check ad-hoc signature
        if: runner.os == 'macOS' && steps.apple.outputs.signed != 'true'
        env:
          PROFILE: ${{ steps.sign.outputs.profile }}
        run: |
          # the build profile's folder only: the cache can hold an older bundle of the other profile
          app=$(find "src-tauri/target/universal-apple-darwin/$PROFILE/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $app"
          out=$(codesign -dv --verbose=2 "$app" 2>&1) || true
          echo "$out"
          grep -q 'Signature=adhoc' <<<"$out"

      # Self-signed certificate (see "macOS signing"): the signature must name the certificate, not the build (cdhash), in the app, in the
      # updater package (.app.tar.gz, made by the bundler after signing) and nowhere an ad-hoc fallback; otherwise the job fails.
      - name: Check self-signed signature
        if: runner.os == 'macOS' && steps.apple.outputs.kind == 'self-signed'
        env:
          PROFILE: ${{ steps.sign.outputs.profile }}
          IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || env.REHEARSAL_APPLE_SIGNING_IDENTITY }}
          # W11.11: a tag run also checks the SHA-1 of the certificate against MAC_CERT_SHA1; a rehearsal and a dry run do not (their certificate is another one)
          EXPECT_SHA1: ${{ github.event_name == 'push' && env.MAC_CERT_SHA1 || '' }}
        run: |
          bundle="src-tauri/target/universal-apple-darwin/$PROFILE/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          tgz=$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n 1)
          bash .github/scripts/mac-verify-selfsigned.sh "$app" "$IDENTITY" "$tgz" "$EXPECT_SHA1"
          # Information only: the disk image is signed by the bundler too
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -n "$dmg" ]; then
            echo "Disk image: $dmg"
            codesign -dv --verbose=2 "$dmg" 2>&1 || true
          fi

      # Only with an Apple Developer ID certificate (see "macOS signing"): a Developer ID signature, accepted by Gatekeeper, and a stapled ticket when notarised.
      - name: Check Developer ID signature and notarisation
        if: runner.os == 'macOS' && steps.apple.outputs.kind == 'developer-id'
        env:
          PROFILE: ${{ steps.sign.outputs.profile }}
          NOTARIZE: ${{ steps.apple.outputs.notarize }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          bundle="src-tauri/target/universal-apple-darwin/$PROFILE/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $app"
          # the whole bundle (frameworks, helpers) must verify, not only the main executable
          codesign --verify --deep --strict --verbose=2 "$app"
          out=$(codesign -dv --verbose=4 "$app" 2>&1) || true
          echo "$out"
          grep -q 'Authority=Developer ID Application' <<<"$out"
          if [ -n "$TEAM" ]; then
            grep -q "TeamIdentifier=$TEAM" <<<"$out"
          else
            echo "::warning::APPLE_TEAM_ID is not set: the Team ID of the signature was not checked"
          fi
          if [ "$NOTARIZE" = "true" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          fi
          # Information only: the bundler notarises the app, not the disk image (see CONTRIBUTING.md > Signing and notarisation)
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -n "$dmg" ]; then
            echo "Disk image: $dmg"
            codesign -dv --verbose=2 "$dmg" 2>&1 || true
            spctl -a -t open --context context:primary-signature -vv "$dmg" || echo "::notice::Gatekeeper does not accept the disk image itself (it is not notarised); check the dmg on a Mac as in CONTRIBUTING.md"
            xcrun stapler validate "$dmg" || echo "::notice::The disk image has no stapled ticket (expected: only the app inside is stapled)"
          fi

      # W11.3: nothing of the rehearsal stays: the files are gone and the variables are emptied for every later step (the runner is thrown away anyway)
      - name: "Rehearsal: remove the throw-away key material"
        if: always() && needs.plan.outputs.rehearse == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/rehearse-* 2>/dev/null || true
          for n in REHEARSAL_TAURI_KEY REHEARSAL_TAURI_KEY_PASSWORD REHEARSAL_APPLE_CERTIFICATE REHEARSAL_APPLE_CERTIFICATE_PASSWORD REHEARSAL_APPLE_SIGNING_IDENTITY; do
            echo "$n=" >> "$GITHUB_ENV"
          done

      # What this job made, on the run page (also when a step failed): was it signed, which files, how big, without opening the log.
      - name: Build summary
        if: always()
        shell: bash
        env:
          REHEARSE: ${{ needs.plan.outputs.rehearse }}
          NAME: ${{ matrix.name }}
          PROFILE: ${{ steps.sign.outputs.profile }}
          SIGNED: ${{ steps.sign.outputs.signed }}
          MAC_SIGNED: ${{ steps.apple.outputs.signed }}
          MAC_KIND: ${{ steps.apple.outputs.kind }}
          SIGNPATH: ${{ needs.plan.outputs.signpath }}
        run: |
          {
            if [ "$REHEARSE" = "true" ]; then echo "**REHEARSAL: signed with throw-away keys. Do not install these files.**"; echo; fi
            echo "### Build ($NAME)"
            echo "profile \`${PROFILE:-?}\`, update signatures \`${SIGNED:-?}\`, SignPath after the build \`${SIGNPATH:-?}\`"
            if [ "$RUNNER_OS" = macOS ]; then echo "macOS signing: signed \`${MAC_SIGNED:-?}\`, certificate \`${MAC_KIND:-none}\`"; fi
            echo
            echo "| file (made in the last 3 hours) | KB |"
            echo "|---|---:|"
            find src-tauri/target -path '*/bundle/*' -type f -mmin -180 \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \) 2>/dev/null | sort | while IFS= read -r f; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(( $(wc -c < "$f") / 1024 ))"
            done
            if [ "$RUNNER_OS" = Windows ] && [ "$PROFILE" = release ] && [ -f src-tauri/target/release/hey-look.exe ]; then
              echo
              echo "hey-look.exe sha256 \`$(sha256sum src-tauri/target/release/hey-look.exe | cut -d' ' -f1)\` (the same file goes into the Store package, job msix)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sign-windows:
    # OFF unless the three repo variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG exist (the plan job
    # decides: tag runs, or a dry run with sign_windows=true; never a test build). Without them this job is skipped and nothing changes:
    # tauri-action has already put the unsigned installers and their update signatures into the draft, and publish goes on.
    # With them: SignPath signs the two Windows installers after the build (it waits for the owner's approval in SignPath), the update
    # signatures are made again from the signed files, checked (verify-update-sigs.cjs, Authenticode = Valid) and replace the unsigned
    # assets of the draft (--clobber). A failure anywhere stops the release: publish needs this job. Owner steps: CONTRIBUTING.md.
    needs: [plan, create-release, build, node-tests, rust-tests, rust-tests-windows, audit]
    if: ${{ !cancelled() && needs.plan.outputs.signpath == 'true' && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.node-tests.result) && (github.event_name != 'push' || (needs.node-tests.result == 'success' && needs.plan.outputs.ui_tests == 'true')) && contains(fromJSON('["success","skipped"]'), needs.rust-tests.result) && contains(fromJSON('["success","skipped"]'), needs.rust-tests-windows.result) && contains(fromJSON('["success","skipped"]'), needs.audit.result) && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
      actions: read
    outputs:
      signed: ${{ steps.cfg.outputs.enabled }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.create-release.outputs.id }}
    steps:
      # The variables exist; the API token is a secret and cannot be tested in `if:`, so it is tested here.
      - name: SignPath settings
        id: cfg
        shell: bash
        env:
          TOKEN: ${{ github.event_name == 'push' && secrets.SIGNPATH_API_TOKEN || '' }}
          REQUIRE: ${{ vars.REQUIRE_WIN_SIGNING }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ] && [ "$REQUIRE" = "true" ]; then
            echo "::error::REQUIRE_WIN_SIGNING is true but the secret SIGNPATH_API_TOKEN is not set"
            exit 1
          fi
          echo "::warning::The SIGNPATH_* variables are set but the secret SIGNPATH_API_TOKEN is not: the Windows installers stay unsigned"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.cfg.outputs.enabled == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Download the unsigned installers
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-unsigned
          path: unsigned

      # SignPath reads the artifact of THIS job's workflow run by its id (origin verification)
      - name: Hand the installers to SignPath
        id: up
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-for-signpath
          path: unsigned/*
          retention-days: 1
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.cfg.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ github.event_name == 'push' && secrets.SIGNPATH_API_TOKEN || '' }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.up.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      # The signed files get the final asset names (the draft's names on a tag run), then the update signatures are made again
      # from them: the signature made at build time belongs to the unsigned file and would fail in every installed app.
      - name: Name the signed installers
        if: steps.cfg.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          one() { # $1 = list, $2 = what: exactly one line
            local n
            n=$(printf '%s\n' "$1" | sed '/^$/d' | wc -l)
            if [ "$n" -ne 1 ]; then echo "::error::expected exactly one $2, found $n"; exit 1; fi
          }
          ls -l signed
          setup=$(ls signed | grep -E -- '-setup\.exe$' || true); one "$setup" "signed *-setup.exe"
          msi=$(ls signed | grep -E -- '\.msi$' || true); one "$msi" "signed *.msi"
          setup_name="$setup"; msi_name="$msi"
          if [ -n "$ID" ]; then
            names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[].name')
            setup_name=$(printf '%s\n' "$names" | grep -E -- '-setup\.exe$' || true); one "$setup_name" "*-setup.exe in the draft release"
            msi_name=$(printf '%s\n' "$names" | grep -E -- '\.msi$' || true); one "$msi_name" "*.msi in the draft release"
          fi
          mkdir out
          cp "signed/$setup" "out/$setup_name"
          cp "signed/$msi" "out/$msi_name"
          ls -l out

      - name: Make the update signatures again
        id: resign
        if: steps.cfg.outputs.enabled == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # a tag run cannot get here: its build jobs fail without the key
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY: the installers are signed but have no update signature (dry run)"
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the tauri CLI only, no package install scripts
          npm ci --ignore-scripts
          for f in out/*-setup.exe out/*.msi; do
            npx --no-install tauri signer sign "$f"
          done
          ls -l out
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Verify the update signatures
        if: steps.resign.outputs.done == 'true'
        shell: bash
        run: node .github/scripts/verify-update-sigs.cjs --conf src-tauri/tauri.conf.json --min 2 out

      - name: Verify the Authenticode signatures
        if: steps.cfg.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($files.Count -ne 2) { throw "expected 2 signed installers, found $($files.Count)" }
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            Write-Host "$($f.Name): $($s.Status) | $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad installer(s) without a valid Authenticode signature" }

      - name: Replace the unsigned installers of the draft release
        if: steps.cfg.outputs.enabled == 'true' && github.event_name == 'push'
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Keep the signed installers of a dry run
        if: steps.cfg.outputs.enabled == 'true' && github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-signed
          path: out/*
          retention-days: 1
          if-no-files-found: error

  publish:
    # Runs only when create-release and all three builds succeeded and sign-windows either succeeded or was not wanted (skipped).
    needs: [plan, create-release, build, sign-windows, store-exe, node-tests, rust-tests, rust-tests-windows, audit]
    timeout-minutes: 30
    permissions:
      contents: write # uploads latest.json and publishes the release
    if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.ui_tests == 'true' && needs.create-release.result == 'success' && needs.build.result == 'success' && needs.node-tests.result == 'success' && needs.rust-tests.result == 'success' && needs.rust-tests-windows.result == 'success' && needs.audit.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.sign-windows.result) && contains(fromJSON('["success","skipped"]'), needs.store-exe.result) }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.create-release.outputs.id }}
      # WP14 option B: with STORE_EXE the release must carry the Store's offline installer (exactly once), without it not at all
      STORE_EXE: ${{ needs.plan.outputs.store_exe }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # With the variable REQUIRE_WIN_SIGNING=true (set at go-live of Windows signing) nothing is published unless SignPath signed the installers.
      - name: Windows signing required?
        env:
          REQUIRE: ${{ vars.REQUIRE_WIN_SIGNING }}
          SIGNED: ${{ needs.sign-windows.outputs.signed }}
        run: |
          if [ "$REQUIRE" = "true" ] && [ "$SIGNED" != "true" ]; then
            echo "::error::REQUIRE_WIN_SIGNING is true but the Windows installers were not signed"
            exit 1
          fi

      # A re-run ("Re-run failed jobs") finds the manifest of the last attempt: it is made again from the current assets.
      - name: Script fixtures
        run: |
          bash .github/scripts/test-check-release-assets.sh
          node .github/scripts/verify-update-sigs.cjs --selftest

      - name: Remove an old latest.json
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id' | while read -r aid; do
            [ -n "$aid" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid"
          done
          true

      - name: Check installers and signatures
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[].name' > names.txt
          cat names.txt
          flag=""; if [ "$STORE_EXE" = true ]; then flag="--store-exe"; fi
          bash .github/scripts/check-release-assets.sh "${GITHUB_REF_NAME#v}" --pre $flag < names.txt

      # Whatever happened to the files after the build (Authenticode, a re-upload), each update signature must still verify against the
      # file it is published with; otherwise every installed app would refuse the update. This stops the release before latest.json exists.
      - name: Verify the update signatures against the published files
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | {name: .name, id: .id}' | jq -s . > ids.json
          mkdir verify
          jq -r '.[] | select(.name | endswith(".sig")) | .name' ids.json | while read -r sname; do
            for n in "$sname" "${sname%.sig}"; do
              aid=$(jq -r --arg n "$n" '.[] | select(.name == $n) | .id' ids.json)
              if [ -z "$aid" ]; then echo "::error::no asset '$n' (belongs to '$sname')"; exit 1; fi
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "verify/$n"
            done
          done
          node .github/scripts/verify-update-sigs.cjs --conf src-tauri/tauri.conf.json --min 6 verify

      - name: Write and upload latest.json
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | {name: .name, size: .size, id: .id}' | jq -s . > assets.json
          mkdir sigs
          jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' assets.json | while read -r aid aname; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "sigs/$aname"
          done
          bash .github/scripts/changelog-section.sh "$V" > notes.md
          node .github/scripts/make-latest-json.cjs generate --version "$V" --assets assets.json --sigs sigs --notes notes.md > latest.json
          node .github/scripts/make-latest-json.cjs check latest.json --version "$V"
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber

      - name: Check the final asset list and latest.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[].name' > names.txt
          cat names.txt
          flag=""; if [ "$STORE_EXE" = true ]; then flag="--store-exe"; fi
          bash .github/scripts/check-release-assets.sh "$V" $flag < names.txt
          node .github/scripts/make-latest-json.cjs check latest.json --version "$V"

      - name: Publish and mark latest
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true

  apt-repo:
    # The signed APT repository of the .deb (https://heylook.namthai.site/apt, WP15; PACKAGING.md > APT repository). TAG RUNS ONLY, after publish: the
    # release is public, so its .deb can be downloaded and checked against the sha256 digest GitHub shows for the asset. The job lists the newest 3
    # published releases, builds the repository with apt-ftparchive (.github/scripts/apt-repo.sh), signs it with the key of the Environment `release`
    # (APT_SIGNING_KEY, APT_SIGNING_PASSPHRASE: read in the signing step only), checks it the way apt does, installs from it in three containers
    # (.github/scripts/apt-install-test.sh), commits the signed metadata (text only, no .deb) to the branch `apt` and starts pages.yml on main,
    # which assembles the site and checks it again. A failure here leaves the release published; fix the cause and "Re-run failed jobs": the
    # job is idempotent (no new commit when nothing changed). A dry run has its own job, apt-repo-dryrun, with a throw-away key and no secret.
    # OFF (DEC-028): the job exists only with the repository variable APT_PUBLISH=true (plan output apt_publish); without it the job is skipped and the
    # tag run needs neither the signing key nor anyone to wait for.
    needs: [plan, publish]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.apt_publish == 'true' && needs.publish.result == 'success' }}
    name: APT repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # pushes the branch `apt`
      actions: write # starts pages.yml (events of the GITHUB_TOKEN start no workflow, but a dispatch does)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the push below hands the token to git for that one command

      - name: Tools
        run: |
          set -euo pipefail
          missing=""
          for c in apt-ftparchive jq gpg gpgv xz docker; do command -v "$c" > /dev/null || missing="$missing $c"; done
          if [ -n "$missing" ]; then
            echo "missing:$missing, installing apt-utils jq gnupg xz-utils"
            sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils jq gnupg xz-utils
          fi
          echo "APT_GNUPGHOME=$RUNNER_TEMP/gnupg-apt" >> "$GITHUB_ENV"

      # the branch `apt` as it is now (it does not exist before the first tag run): the old pool.json for the "a published file never changes"
      # rule and the by-hash files of the last generation
      - name: The branch apt, as it is
        run: git clone --quiet --depth 1 --branch apt "https://github.com/$GITHUB_REPOSITORY" apt-prev || { echo "::notice::no branch apt yet"; mkdir apt-prev; }

      - name: The .deb files of the newest 3 releases
        run: |
          set -euo pipefail
          old=""; [ -f apt-prev/pool.json ] && old="--old-pool apt-prev/pool.json"
          bash .github/scripts/apt-repo.sh fetch --repo "$GITHUB_REPOSITORY" --keep 3 --out debs --require-version "${GITHUB_REF_NAME#v}" $old
          # the tray library: the .deb of this release must name the Ayatana one (Debian 12 has no libappindicator3-1)
          deps=$(dpkg-deb -f "debs/hey-look_${GITHUB_REF_NAME#v}_amd64.deb" Depends)
          echo "Depends of ${GITHUB_REF_NAME#v}: $deps"
          case ",$deps," in *"libayatana-appindicator3-1"*) ;; *) echo "::error::the .deb does not depend on libayatana-appindicator3-1"; exit 1 ;; esac
          case ",$deps," in *"libappindicator3-1"*) echo "::error::the .deb still depends on libappindicator3-1"; exit 1 ;; esac

      - name: Build the repository
        run: bash .github/scripts/apt-repo.sh build debs repo --previous apt-prev

      # The only step that sees the key. Secrets are read on a tag push only; the key is imported into a folder of its own under RUNNER_TEMP
      # (umask 077) and never touches the workspace; the passphrase goes to gpg on fd 0 (loopback pinentry); no `set -x`.
      - name: Sign
        env:
          APT_SIGNING_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.APT_SIGNING_KEY || '' }}
          APT_SIGNING_PASSPHRASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.APT_SIGNING_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          for n in APT_SIGNING_KEY APT_SIGNING_PASSPHRASE; do
            if [ -z "${!n}" ]; then echo "::error::the secret $n is not set in the Environment 'release' (PACKAGING.md > APT repository, owner steps)"; exit 1; fi
          done
          echo "::add-mask::$APT_SIGNING_PASSPHRASE"
          umask 077
          export GNUPGHOME="$APT_GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import 2> /dev/null || { echo "::error::APT_SIGNING_KEY could not be imported (an ASCII-armoured secret key is expected)"; exit 1; }
          # exactly one secret key, and it is the one whose public half is on the website
          n=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" {n++} END {print n + 0}')
          if [ "$n" != 1 ]; then echo "::error::APT_SIGNING_KEY holds $n secret keys, expected exactly one"; exit 1; fi
          have=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" {print $10; exit}')
          want=$(bash .github/scripts/apt-repo.sh fingerprint docs/apt/heylook-archive-keyring.asc)
          if [ "$have" != "$want" ]; then
            echo "::error::the imported key has the fingerprint $have, docs/apt/heylook-archive-keyring.asc has $want. Nothing was signed."
            exit 1
          fi
          bash .github/scripts/apt-repo.sh sign repo "$have"

      - name: Remove the key
        if: always()
        run: |
          GNUPGHOME="$APT_GNUPGHOME" gpgconf --kill gpg-agent 2> /dev/null || true
          rm -rf "$APT_GNUPGHOME"

      - name: Check the signed repository
        run: |
          set -euo pipefail
          bash .github/scripts/apt-repo.sh verify repo docs/apt/heylook-archive-keyring.gpg
          bash .github/scripts/apt-repo.sh summary repo docs/apt/heylook-archive-keyring.gpg >> "$GITHUB_STEP_SUMMARY"

      - name: Install tests in ubuntu:22.04, ubuntu:24.04 and debian:12
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          prev=$(jq -r --arg v "$v" '[.[].version | select(. != $v)] | sort_by(split(".") | map(tonumber)) | last // ""' repo/pool.json)
          bash .github/scripts/apt-install-test.sh local --repo repo --keyring docs/apt/heylook-archive-keyring.gpg --sources docs/apt/heylook.sources --version "$v" ${prev:+--previous "$prev"}

      # the metadata only (dists/ and pool.json, no .deb); nothing is pushed when Packages and pool.json are the same as on the branch
      - name: Commit to the branch apt
        id: branch
        env:
          APT_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/apt-repo.sh publish-branch repo "https://github.com/$GITHUB_REPOSITORY" | tee branch.out
          echo "changed=$(sed -n 's/^changed=//p' branch.out | tail -1)" >> "$GITHUB_OUTPUT"

      # The website is rebuilt by pages.yml on main. Started when the branch changed, and also when the live InRelease is not the one on the
      # branch (a re-run after a failed dispatch, or a Pages deploy that never ran for this commit).
      - name: Start pages.yml
        env:
          CHANGED: ${{ steps.branch.outputs.changed }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch apt "https://github.com/$GITHUB_REPOSITORY" apt-now
          branch_sha=$(sha256sum apt-now/dists/stable/InRelease | cut -d' ' -f1)
          live_sha=$(curl -fsS -H 'Cache-Control: no-cache' https://heylook.namthai.site/apt/dists/stable/InRelease 2> /dev/null | sha256sum | cut -d' ' -f1 || true)
          echo "InRelease on the branch $branch_sha, live $live_sha, branch changed: $CHANGED"
          if [ "$CHANGED" = true ] || [ "$branch_sha" != "$live_sha" ]; then
            gh workflow run pages.yml --ref main
            echo "pages.yml started on main" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "the live site already serves this InRelease: pages.yml is not started" >> "$GITHUB_STEP_SUMMARY"
          fi

  apt-repo-dryrun:
    # The same repository, from the .deb of THIS dry run, with a throw-away key made in the job (no passphrase, deleted at the end). It reads no
    # secret, has no Environment, pushes nothing and starts nothing. The result is the artifact apt-repo-dryrun (public key included, no private
    # key). Releases older than the checkout's version are added to the pool, so the upgrade test (install the previous version, then upgrade) runs.
    needs: [plan, build]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.test_version == '' && needs.plan.outputs.tests == 'true' && needs.build.result == 'success' }}
    name: APT repository (dry run)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tools
        run: |
          set -euo pipefail
          missing=""
          for c in apt-ftparchive jq gpg gpgv xz docker; do command -v "$c" > /dev/null || missing="$missing $c"; done
          if [ -n "$missing" ]; then
            echo "missing:$missing, installing apt-utils jq gnupg xz-utils"
            sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils jq gnupg xz-utils
          fi

      - name: The script's own test
        run: bash .github/scripts/apt-repo.sh --selftest

      - name: The .deb of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-amd64-deb
          path: this-deb

      - name: The .deb files
        run: |
          set -euo pipefail
          ls -l this-deb
          one=$(find this-deb -name '*.deb' | head -n 2)
          if [ "$(printf '%s\n' "$one" | wc -l)" != 1 ]; then echo "::error::expected exactly one .deb in the artifact linux-amd64-deb"; exit 1; fi
          control() { dpkg-deb -f "$one" "$1"; }
          echo "package $(control Package) version $(control Version) architecture $(control Architecture)"
          deps=$(control Depends)
          echo "Depends: $deps"
          {
            echo "### The .deb of this run"
            echo "\`Depends: $deps\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case ",$deps," in *"libayatana-appindicator3-1"*) ;; *) echo "::error::the .deb does not depend on libayatana-appindicator3-1"; exit 1 ;; esac
          case ",$deps," in *"libappindicator3-1"*) echo "::error::the .deb still depends on libappindicator3-1"; exit 1 ;; esac
          echo "ONE_DEB=$one" >> "$GITHUB_ENV"
          echo "DEB_VERSION=$(control Version)" >> "$GITHUB_ENV"
          bash .github/scripts/apt-repo.sh fetch --repo "$GITHUB_REPOSITORY" --keep 3 --out debs --local-deb "$one"

      # a key that exists in this job only
      - name: A throw-away key
        run: |
          set -euo pipefail
          fpr=$(bash .github/scripts/apt-repo.sh genkey "$RUNNER_TEMP/gnupg-throwaway" "Hey Look! APT test (throwaway)" "$RUNNER_TEMP/throwaway-public")
          echo "THROWAWAY_FPR=$fpr" >> "$GITHUB_ENV"
          echo "GNUPGHOME_THROWAWAY=$RUNNER_TEMP/gnupg-throwaway" >> "$GITHUB_ENV"
          echo "throw-away key $fpr"

      - name: Build, sign and check the repository
        run: |
          set -euo pipefail
          bash .github/scripts/apt-repo.sh build debs repo
          GNUPGHOME="$GNUPGHOME_THROWAWAY" bash .github/scripts/apt-repo.sh sign repo "$THROWAWAY_FPR"
          bash .github/scripts/apt-repo.sh verify repo "$RUNNER_TEMP/throwaway-public/heylook-archive-keyring.gpg"
          bash .github/scripts/apt-repo.sh summary repo "$RUNNER_TEMP/throwaway-public/heylook-archive-keyring.gpg" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP"/throwaway-public/heylook-archive-keyring.* repo/
          cp docs/apt/heylook.sources repo/heylook.sources
          # the artifact holds public material only
          if grep -rl 'PRIVATE KEY BLOCK' repo; then echo "::error::a private key is in the repository folder"; exit 1; fi
          sed -n 1,12p repo/dists/stable/Release

      - name: Install tests in ubuntu:22.04, ubuntu:24.04 and debian:12
        run: |
          set -euo pipefail
          prev=$(jq -r --arg v "$DEB_VERSION" '[.[].version | select(. != $v)] | sort_by(split(".") | map(tonumber)) | last // ""' repo/pool.json)
          echo "version $DEB_VERSION, previous ${prev:-none}"
          bash .github/scripts/apt-install-test.sh local --repo repo --keyring "$RUNNER_TEMP/throwaway-public/heylook-archive-keyring.gpg" --sources docs/apt/heylook.sources --version "$DEB_VERSION" ${prev:+--previous "$prev"}

      - name: Remove the key
        if: always()
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg-throwaway" gpgconf --kill gpg-agent 2> /dev/null || true
          rm -rf "$RUNNER_TEMP/gnupg-throwaway"

      - name: Keep the repository of this dry run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apt-repo-dryrun
          path: repo
          retention-days: 1
          if-no-files-found: error

  msix:
    # WP14 option A (spec WA.1): the Microsoft Store package. Whenever Windows is built and it is not a test build (the plan job says). The exe is the
    # one of the Windows build job (artifact windows-exe), byte for byte; the package is made by scripts/msix-build.mjs with the Windows SDK of the runner
    # (makeappx, makepri, signtool). The package for Partner Center is NOT signed (the Store signs it after certification, MSIX-REQ); a copy signed with a
    # throw-away certificate (subject = Publisher, key deleted at once) is the artifact msix-test, for msix-check and for a Windows Sandbox.
    # No Environment, no secret: the identity values are PUBLIC (Partner Center > Product identity). They are written here as defaults, and the repository
    # variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME override them (for example when the publisher name is changed in Partner
    # Center), so a tag run never fails for a missing variable; scripts/test-msix-build.mjs pins the three values. A dry run's package is never named
    # msix-store. The job is not a need of `publish`.
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.msix == 'true' && needs.build.result == 'success' }}
    name: MSIX package (Microsoft Store)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.build.outputs.ready }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: The exe of the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: exe

      # the same tests as the node shard `static` runs (the pure ones) and, here where the Windows SDK and a browser exist, a real pack and unpack
      - name: Tests of the package scripts
        shell: bash
        run: node scripts/test-msix-build.mjs

      - name: Build the package
        id: build
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || '40278Noamo.651773BC9C4C7' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=FE739770-637C-437D-B2B9-DAA2E2EA56F1' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Noamo' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          extra=()
          # a tag run needs the real identity and the version of the tag
          if [ "$EVENT" = "push" ]; then extra+=(--require-identity --expect-version "${GITHUB_REF_NAME#v}"); fi
          node scripts/msix-build.mjs --exe exe/hey-look.exe --out msix-out --test-sign --store-logos --github-output --tmp "$RUNNER_TEMP/msix-sign" "${extra[@]}"
          ls -l msix-out

      # AC-WA.1.1: makeappx unpack of both packages, manifest as the spec says, hey-look.exe byte-identical to the exe of the NSIS build
      - name: Unpack and check both packages
        shell: bash
        run: |
          set -euo pipefail
          for f in msix-out/HeyLook_*_x64.msix msix-out/HeyLook_*_x64_test.msix; do
            echo "== $f"
            node scripts/msix-verify.mjs "$f" --from msix-out/msix-build.json --exe exe/hey-look.exe
          done

      # nothing private may leave the job
      - name: No key in the output
        shell: bash
        run: |
          if find msix-out -type f \( -name '*.pfx' -o -name '*.key' -o -name '*.p12' -o -name '*.pem' \) | grep .; then echo "::error::key material in msix-out"; exit 1; fi
          if grep -rIl 'PRIVATE KEY' msix-out; then echo "::error::a private key in msix-out"; exit 1; fi
          if ls "$RUNNER_TEMP"/msix-sign/* > /dev/null 2>&1; then echo "::error::key files are left in the signing folder"; ls -l "$RUNNER_TEMP/msix-sign"; exit 1; fi
          echo "no key material in the output"

      - name: Summary
        if: always()
        shell: bash
        env:
          READY: ${{ steps.build.outputs.ready }}
        run: |
          {
            echo "### MSIX package (Microsoft Store)"
            if [ -f msix-out/msix-build.json ]; then
              jq -r '"version `\(.version)` (package version `\(.msixVersion)`), x64", "identity name `\(.identity.name)`, publisher `\(.identity.publisher)`, publisher display name `\(.identity.publisherDisplayName)`" + (if .identity.dev then " (PLACEHOLDER: the repository variables are not set)" else "" end), "hey-look.exe sha256 `\(.exe.sha256)` (the same as in the NSIS build job)", "", "| file | KB |", "|---|---:|", "| \(.msix.file) | \(.msix.bytes / 1024 | floor) |", (if .test then "| \(.test.file) (throw-away certificate) | \(.test.bytes / 1024 | floor) |" else empty end)' msix-out/msix-build.json
              if [ "$READY" != "true" ]; then echo; echo "NOT FOR SUBMISSION: the app has no packaged mode yet (src-tauri/msix/readiness.json, WP14 part 2). The tag-run artifact is named msix-store-NOT-READY."; fi
            else
              echo "the package was not made"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # what the owner uploads to Partner Center (tag runs only, never the GitHub release)
      - name: Keep the package for Partner Center
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.ready == 'true' && 'msix-store' || 'msix-store-NOT-READY' }}
          path: msix-out/HeyLook_*_x64.msix
          retention-days: 14
          if-no-files-found: error

      - name: Keep the Store listing images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msix-store-logos
          path: msix-out/store/*.png
          retention-days: ${{ github.event_name == 'push' && 14 || 1 }}
          if-no-files-found: error

      # the test-signed copy and its PUBLIC certificate (msix-check, Windows Sandbox)
      - name: Keep the test-signed copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msix-test
          path: |
            msix-out/HeyLook_*_x64_test.msix
            msix-out/HeyLook-test.cer
            msix-out/msix-build.json
          retention-days: 1
          if-no-files-found: error

  msix-check:
    # WP14 option A (spec WA.4): installs the test-signed package on this disposable runner (the throw-away certificate goes into the machine store of the
    # VM, which is thrown away), starts it, checks it, removes it (.github/scripts/msix-check.ps1), and runs the Windows App Certification Kit when the
    # runner has one. No Environment, no secret. Windows PowerShell 5.1 (`shell: powershell`): the Appx cmdlets live there.
    needs: [msix]
    if: ${{ !cancelled() && needs.msix.result == 'success' }}
    name: MSIX install check
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The test-signed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix-test
          path: msix-test

      - name: Install, start, check and remove
        shell: powershell
        run: .\.github\scripts\msix-check.ps1 -Dir msix-test -WackReport "$env:RUNNER_TEMP\wack-report.xml"

      - name: Keep the certification kit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msix-wack-report
          path: ${{ runner.temp }}\wack-report.xml
          retention-days: 1
          if-no-files-found: ignore

  store-submit:
    # WP14 WA.5, OFF (DEC-005 item 6): runs only on a tag run with the repository variable STORE_SUBMIT=true, and only for a package whose app has its packaged
    # mode. The Environment `store` (owner as required reviewer; secrets AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID, AZURE_AD_APPLICATION_SECRET,
    # SELLER_ID; variable STORE_PRODUCT_ID) is only asked for when the job runs, so without STORE_SUBMIT nothing waits and no secret is read.
    # Partner Center takes an update only after the first submission was made by hand (Microsoft: "You can't use the CLI to complete the first publication").
    # The commands are written from Microsoft's documentation of the Store Developer CLI and have never run (PACKAGING.md > Microsoft Store).
    needs: [plan, publish, msix, msix-check]
    if: ${{ !cancelled() && needs.plan.outputs.store_submit == 'true' && needs.publish.result == 'success' && needs.msix.result == 'success' && needs.msix-check.result == 'success' && needs.msix.outputs.ready == 'true' }}
    name: Store submission (MSIX)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    environment: store
    permissions:
      contents: read
    steps:
      - name: The package for Partner Center
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix-store
          path: msix-store

      - name: Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure the CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          foreach ($n in 'TENANT_ID', 'CLIENT_ID', 'CLIENT_SECRET', 'SELLER_ID') {
            if (-not (Get-Item "env:$n").Value) { throw "the secret for $n is not set in the Environment 'store'" }
          }
          Write-Host "::add-mask::$env:CLIENT_SECRET"
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }

      - name: Publish the package
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          if (-not $env:PRODUCT_ID) { throw "the repository variable STORE_PRODUCT_ID is not set" }
          $pkg = Get-ChildItem msix-store -Filter 'HeyLook_*_x64.msix' | Select-Object -First 1
          if (-not $pkg) { throw "no HeyLook_*_x64.msix in the artifact msix-store" }
          msstore publish msix-store --inputFile $pkg.FullName --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

  store-exe:
    # WP14 option B (spec W14.2), OFF (DEC-005): only with the repository variable STORE_EXE=true (the plan job). The offline NSIS installer for the
    # Store (the WebView2 Runtime inside, about 127 MB more) is built from the same source with a second configuration (src-tauri/tauri.store-exe.conf.json),
    # named HeyLook_<V>_windows_x64_offline.exe (not *-setup.exe, so latest.json and the one-setup.exe checks never see it) and attached to the draft release
    # (a tag run) or kept as the artifact store-exe-dryrun. It is built here and not in the Windows build job because the bundler overwrites the normal
    # installer; the build reads the same embedded client ids (tag runs, Environment release), no update key. Microsoft wants it Authenticode-signed
    # (W14.3: SignPath Foundation or a certificate, only on a trigger, section 8 of the spec): until a signing step exists the job says so and `store-url`
    # refuses to publish an unsigned file.
    needs: [plan, create-release]
    if: ${{ !cancelled() && needs.plan.outputs.store_exe == 'true' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    name: Store offline installer (option B)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write # uploads the installer into the draft release (tag runs)
    outputs:
      signed: ${{ steps.file.outputs.signed }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (a SHA pin needs the toolchain named)
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref_type != 'tag' }}

      - name: OAuth client ids present (tag runs)
        if: github.event_name == 'push'
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          bad=0
          for n in GOOGLE_CLIENT_ID MICROSOFT_CLIENT_ID; do
            if [ -z "${!n}" ]; then echo "::error::$n is not set (add it to the environment 'release'): the Store installer would have no sign-in"; bad=1; fi
          done
          exit $bad

      - name: Verify version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then V="${GITHUB_REF_NAME#v}"; PUBKEY=error; else V="-"; PUBKEY=warn; fi
          node .github/scripts/verify-version.cjs "$V" . --pubkey="$PUBKEY"

      - run: npm ci

      # the same build as the release (the embedded client ids are part of the binary), bundled as the offline NSIS installer only
      - name: Build the offline installer
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ github.event_name == 'push' && secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.GOOGLE_CLIENT_SECRET || '' }}
          MICROSOFT_CLIENT_ID: ${{ github.event_name == 'push' && secrets.MICROSOFT_CLIENT_ID || '' }}
          MICROSOFT_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.MICROSOFT_CLIENT_SECRET || '' }}
        run: npx tauri build --bundles nsis --config src-tauri/tauri.store-exe.conf.json

      - name: The Windows app is a GUI program, without the test bridge
        shell: bash
        run: |
          node .github/scripts/check-pe-subsystem.cjs src-tauri/target/release/hey-look.exe --expect gui
          node .github/scripts/check-no-test-bridge.cjs src-tauri/target/release/hey-look.exe

      - name: Name the installer
        id: file
        shell: pwsh
        run: |
          $v = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $setups = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($setups.Count -ne 1) { throw "expected exactly one *-setup.exe, found $($setups.Count)" }
          $name = "HeyLook_${v}_windows_x64_offline.exe"
          Copy-Item $setups[0].FullName $name
          $item = Get-Item $name
          # the WebView2 Runtime is inside: a normal installer is about 8 MB, this one about 135 MB
          if ($item.Length -lt 100MB) { throw "$name has $($item.Length) bytes: it does not look like an offline installer (WebView2 Runtime inside)" }
          $sig = Get-AuthenticodeSignature -FilePath $name
          $signed = ($sig.Status -eq 'Valid')
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $sha = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower()
          "### Store offline installer (option B)`n`n$name, $([math]::Round($item.Length / 1MB, 1)) MB, sha256 ``$sha``, Authenticode: $($sig.Status)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (-not $signed) { Write-Host "::warning::$name is not Authenticode-signed (W14.3 is not built yet): the Store refuses it, and store-url will not publish it" }

      # tag run: into the draft release (publish checks the list: exactly one, no signature); dry run: an artifact
      - name: Attach to the draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          NAME: ${{ steps.file.outputs.name }}
        run: gh release upload "$GITHUB_REF_NAME" "$NAME" --clobber

      - name: Keep the installer of a dry run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-exe-dryrun
          path: ${{ steps.file.outputs.name }}
          retention-days: 1
          if-no-files-found: error

  store-url:
    # WP14 option B (spec W14.1), OFF with STORE_EXE. After `publish`: the offline installer of the published release is checked (the sha256 GitHub states for
    # the asset, a valid Authenticode signature), pages.yml is started on main (it adds the installers of the newest 3 releases under /downloads/<V>/ and
    # checks every one against its digest), and when that deploy is done the address Partner Center gets is checked from outside: 200, no redirect,
    # the size, the sha256 (.github/scripts/store-url-check.sh). The pages.yml on main must already be the one with this step: merge the release branch first,
    # or re-run this job after the merge ("Re-run failed jobs"). A failure here leaves the release published.
    needs: [plan, publish, store-exe]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.store_exe == 'true' && needs.publish.result == 'success' && needs.store-exe.result == 'success' }}
    name: Store installer address (option B)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write # starts pages.yml (events of the GITHUB_TOKEN start no workflow, but a dispatch does)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The published installer
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          NAME="HeyLook_${V}_windows_x64_offline.exe"
          info=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq ".assets[] | select(.name == \"$NAME\") | {digest, size}")
          digest=$(jq -r .digest <<< "$info" | tr -d '\r'); size=$(jq -r .size <<< "$info" | tr -d '\r')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::GitHub states no sha256 digest for $NAME ('$digest')"; exit 1; }
          mkdir dl
          gh release download "$GITHUB_REF_NAME" --pattern "$NAME" --dir dl
          got=$(sha256sum "dl/$NAME" | cut -d' ' -f1)
          [ "sha256:$got" = "$digest" ] || { echo "::error::the download has sha256 $got, GitHub says $digest"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$got" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      # Partner Center (MS-POL 10.2.9): the installer and its PE files must be signed by the publisher with a Trusted Root Program CA
      - name: Authenticode signature
        shell: pwsh
        env:
          NAME: ${{ steps.asset.outputs.name }}
        run: |
          $s = Get-AuthenticodeSignature -FilePath "dl/$env:NAME"
          Write-Host "$($env:NAME): $($s.Status) | $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "$($env:NAME) has no valid Authenticode signature ($($s.Status)): the Store refuses it. W14.3 (signing) is not in place." }

      - name: Start pages.yml on main and wait for it
        shell: bash
        run: |
          set -euo pipefail
          before=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main
          id=""
          for i in $(seq 1 30); do
            id=$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$before\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "::error::the dispatched pages.yml run was not found"; exit 1; }
          echo "pages.yml run $id"
          gh run watch "$id" --exit-status

      - name: The address from outside
        shell: bash
        env:
          V: ${{ steps.asset.outputs.version }}
          SHA: ${{ steps.asset.outputs.sha256 }}
          SIZE: ${{ steps.asset.outputs.size }}
        run: |
          bash .github/scripts/store-url-check.sh "$V" "$SHA" "$SIZE" | tee url.out
          {
            echo "### Store installer address"
            echo "https://heylook.namthai.site/downloads/$V/HeyLook_${V}_windows_x64_offline.exe (sha256 \`$SHA\`, $SIZE bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

  store-submit-exe:
    # WP14 W14.8b, OFF: needs both STORE_EXE and STORE_SUBMIT (tag runs). Gives Partner Center the address of the new offline installer: `msstore submission get`,
    # the old versioned address in that JSON replaced by the new one (nothing else changes), `submission update`, `publish`, `poll`. The EXE/MSI product is
    # another Partner Center product than the MSIX one (variable STORE_EXE_PRODUCT_ID); Microsoft requires its first submission to be made by hand. Environment `store`.
    # Written from Microsoft's documentation of the Store Developer CLI (MSI/EXE); has never run.
    needs: [plan, store-url]
    if: ${{ !cancelled() && needs.plan.outputs.store_exe == 'true' && needs.plan.outputs.store_submit == 'true' && needs.store-url.result == 'success' }}
    name: Store submission (EXE installer)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    environment: store
    permissions:
      contents: read
    steps:
      - name: Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure the CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          foreach ($n in 'TENANT_ID', 'CLIENT_ID', 'CLIENT_SECRET', 'SELLER_ID') {
            if (-not (Get-Item "env:$n").Value) { throw "the secret for $n is not set in the Environment 'store'" }
          }
          Write-Host "::add-mask::$env:CLIENT_SECRET"
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }

      - name: Give Partner Center the new address
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_EXE_PRODUCT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:PRODUCT_ID) { throw "the repository variable STORE_EXE_PRODUCT_ID is not set" }
          $v = $env:TAG.TrimStart('v')
          $new = "https://heylook.namthai.site/downloads/$v/HeyLook_${v}_windows_x64_offline.exe"
          $pattern = 'https://heylook\.namthai\.site/downloads/[0-9]+\.[0-9]+\.[0-9]+/HeyLook_[0-9]+\.[0-9]+\.[0-9]+_windows_x64_offline\.exe'
          $json = (msstore submission get $env:PRODUCT_ID | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed" }
          $n = [regex]::Matches($json, $pattern).Count
          if ($n -lt 1) { throw "the submission holds no address of the form $pattern: set the first address by hand in Partner Center" }
          $updated = [regex]::Replace($json, $pattern, $new)
          msstore submission update $env:PRODUCT_ID $updated
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update failed" }
          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed" }
          msstore submission poll $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission poll reports a failed submission" }
          "### Store submission (EXE)`n$n address(es) in the submission now point to $new" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
