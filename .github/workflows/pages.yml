name: Pages

# Deploys the website in docs/ to GitHub Pages (https://thnonl.github.io/hey-look/). The site is plain files: nothing is built.
# It runs when docs/ or this file changes on main or release/v1.0.0, or by hand. It never touches releases or tags.
on:
  push:
    branches: [main, release/v1.0.0]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
