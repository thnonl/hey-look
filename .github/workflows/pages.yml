name: Pages

# Validates and deploys the website in docs/ to GitHub Pages (https://heylook.namthai.site/).
# It validates all SEO, metadata, language reciprocal links, word budgets, and 404 behavior,
# then builds an optimized production bundle (_site) with minified CSS/JS and LCP preloads.
# It runs when docs/, site scripts, or this workflow change on main or release branches, or manually.
#
# The APT repository (https://heylook.namthai.site/apt, WP15, PACKAGING.md > APT repository) is part of the site: when the branch `apt` exists
# (the release workflow writes it on every tag run: signed metadata, text only), its dists/ and pool.json are added under apt/, the .deb files
# named by pool.json are downloaded from the GitHub releases, and everything is checked the way a client checks it (signature with the public key
# committed in docs/apt, every hash, every .deb against Packages) BEFORE anything is uploaded: write access to the branch alone cannot publish a
# forged repository. No secret is used here. The release workflow starts this one (workflow_dispatch on main) after it updated the branch, because
# events of the GITHUB_TOKEN start no workflow. After the deploy the job apt-live-check waits for the live InRelease and installs from the live address.
#
# DORMANT UNTIL THE REPOSITORY EXISTS (DEC-022): APT_SITE is `on` only when the branch `apt` exists (the step aptbranch below), else `off`. No input and
# no variable can change that. Off: build-site.mjs takes the "Install with APT" block out of the 8 download pages and does not copy docs/apt/, and
# `test-site-apt.mjs --built=_site` proves the built site has none of it, so the site never advertises a repository that does not exist and the
# throw-away key of docs/apt (until the owner's real key is committed) never reaches the site. On: the throw-away key fails the run hard, before the upload.
#
# THE STORE'S OFFLINE INSTALLER (WP14 option B, DEC-005): with the repository variable STORE_EXE = true (and only then) the site also carries
# /downloads/<V>/HeyLook_<V>_windows_x64_offline.exe for the newest 3 published releases that have it (.github/scripts/store-exe-assemble.sh: downloaded from
# the release, sha256 and size checked against what GitHub states for the asset, before anything is uploaded), and robots.txt disallows /downloads/.
# Without the variable (unset, or any other value) the step does nothing and the site is what it always was. This is the only use of `vars.` here
# (scripts/test-apt-placeholder-guard.mjs keeps it that way): the APT repository is still decided by the branch check alone.
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "docs/**"
      - "scripts/build-site.mjs"
      - "scripts/generate-site-languages.mjs"
      - "scripts/lib/site-seo.mjs"
      - ".github/workflows/pages.yml"
      - ".github/scripts/apt-assemble.sh"
      - ".github/scripts/apt-live-check.sh"
      - ".github/scripts/store-exe-assemble.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      apt: ${{ steps.apt.outputs.present }}
      apt_version: ${{ steps.apt.outputs.version }}
      inrelease_sha256: ${{ steps.apt.outputs.inrelease_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # the signed metadata of the APT repository; before the first tag run there is none and the site is built as it always was
      - name: Is there an APT repository?
        id: aptbranch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" apt > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No branch apt yet: the site is deployed without /apt/ (the first tag run of the release workflow makes the branch)"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.aptbranch.outputs.present == 'true'
        with:
          ref: apt
          path: apt-branch
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify site SEO and integrity
        env:
          APT_SITE: ${{ steps.aptbranch.outputs.present == 'true' && 'on' || 'off' }}
        run: |
          node scripts/generate-site-languages.mjs --check
          node scripts/test-site-languages.mjs --strict
          node scripts/test-site-seo.mjs
          node scripts/test-site-length.mjs
          node scripts/test-site-404.mjs
          node scripts/test-site-apt.mjs

      - name: Build and optimize production site
        env:
          APT_SITE: ${{ steps.aptbranch.outputs.present == 'true' && 'on' || 'off' }}
          STORE_EXE: ${{ vars.STORE_EXE == 'true' && 'on' || 'off' }}
        run: node scripts/build-site.mjs _site

      # off: the built site has no APT block, marker, apt/ folder, link or text; on: it has the block on the 8 download pages and the key files
      - name: Check the built site for the APT repository
        env:
          APT_SITE: ${{ steps.aptbranch.outputs.present == 'true' && 'on' || 'off' }}
        run: |
          node scripts/test-site-apt.mjs --built=_site
          if [ "$APT_SITE" = off ]; then echo "APT block left out (no branch apt)" >> "$GITHUB_STEP_SUMMARY"; fi

      # signature, hashes and pool files are checked here; a failure stops the deploy and the site stays as it is
      - name: Add the APT repository
        id: apt
        env:
          PRESENT: ${{ steps.aptbranch.outputs.present }}
        run: |
          set -euo pipefail
          if [ "$PRESENT" != true ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          command -v jq > /dev/null && command -v gpgv > /dev/null && command -v xz > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq gpgv xz-utils; }
          out=$(bash .github/scripts/apt-assemble.sh _site apt-branch docs/apt/heylook-archive-keyring.gpg | tee /dev/stderr)
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "$out" | grep -E '^(version|inrelease_sha256)=' >> "$GITHUB_OUTPUT"
          {
            echo "### APT repository deployed"
            echo "newest version \`$(echo "$out" | sed -n 's/^version=//p')\`, InRelease sha256 \`$(echo "$out" | sed -n 's/^inrelease_sha256=//p')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # WP14 option B: only with STORE_EXE = true; a mismatch of any file stops the deploy and the site stays as it is
      - name: Add the Store offline installers
        env:
          STORE_EXE: ${{ vars.STORE_EXE == 'true' && 'on' || 'off' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$STORE_EXE" != on ]; then
            echo "STORE_EXE is not true: the site gets no /downloads/"
            exit 0
          fi
          out=$(bash .github/scripts/store-exe-assemble.sh _site "$GITHUB_REPOSITORY" 3 | tee /dev/stderr)
          {
            echo "### Store offline installers deployed"
            echo "$out" | tr '\n' ' '
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  apt-live-check:
    # After a deploy that carried the APT repository: the live files are the deployed ones and a user can install from them.
    needs: deploy
    if: ${{ needs.deploy.outputs.apt == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # waits up to 20 minutes for the CDN (and the owner's Caddy cache), then curl -I of InRelease, Packages.xz, a by-hash file and the newest
      # .deb (200, no Location, no Content-Encoding, the right length), the sha256 of the .deb against Packages and the GitHub release digest
      - name: The live files
        env:
          INRELEASE_SHA256: ${{ needs.deploy.outputs.inrelease_sha256 }}
        run: bash .github/scripts/apt-live-check.sh "$INRELEASE_SHA256"

      # the three commands of the download page, against the live https address, in a fresh ubuntu:24.04
      - name: Install from the live address
        env:
          VERSION: ${{ needs.deploy.outputs.apt_version }}
        run: bash .github/scripts/apt-install-test.sh live --version "$VERSION"
