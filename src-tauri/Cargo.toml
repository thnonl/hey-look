[package]
name = "hey-look"
version = "1.0.11"
description = "Hey Look! desktop mail client"
license = "MIT"
authors = ["thnonl"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hey_look_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
imap = "2.4.1"
# the types of a BODYSTRUCTURE (serversearch.rs); the version imap already uses
imap-proto = "0.10.2"
native-tls = "0.2.18"
# full_encoding: the CJK charsets (Shift_JIS, EUC-JP, GBK / GB2312 / GB18030, Big5, ISO-2022-JP, EUC-KR) of a Subject, a body and an encoded label name (fix52); encoding_rs is already in the lock file through reqwest
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
lettre = "0.11.23"
# smtp.rs `text_body`: the transfer encoding of a text part is chosen as lettre chooses it; already in the lock file through lettre (same version)
email-encoding = "0.4.2"
# internationalized domain names in the ASCII form (RCPT TO, To, Message-ID); already in the lock file through lettre
idna = "1"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form"] }
chrono = "0.4.45"
chrono-tz = "0.10"
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.23.1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
keyring = "3"
sha2 = "0.11.0"
rand = "0.10.3"
urlencoding = "2.1.3"
fontdue = "0.9"
hickory-resolver = "0.26.3"
roxmltree = "0.21.1"
pgp = { version = "0.21", default-features = false }
rand08 = { package = "rand", version = "0.8" }
smallvec = "1"
# snippet.rs cuts preview text on grapheme boundaries (emoji sequences, combining marks); already in the lock file
unicode-segmentation = "1"
# NFC for matching the "view in browser" phrases (W6.13); the version is the one already in Cargo.lock (through url / idna)
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
semver = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.13"

# Windows: the updater without its "zip" feature. That feature only adds the unpacking of a .zip update package (zip 4.x, RUSTSEC-2026-0367/0368/0369, no
# fix in the 4.x line and the plugin has no release on zip 9 yet) and, on macOS and Linux, the .tar.gz / AppImage unpacking (needed there). Our Windows packages
# are the NSIS setup .exe and the .msi (.github/scripts/make-latest-json.cjs), never a zip, so the Windows build does not compile the zip crate at all.
[target.'cfg(windows)'.dependencies.tauri-plugin-updater]
version = "2.13"
default-features = false
features = ["rustls-tls", "system-proxy"]

# macOS / Linux native notifications (Windows has its own toasts with buttons, see shell.rs); used from Rust only
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# custom window frame: caption-button hit-testing (Snap Layouts) + system menu, see src/winframe.rs
# the web view's own process events (webview_health.rs): the same version tauri's runtime uses, so the types are shared
webview2-com = "0.39"
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "UI_Notifications", "Wdk_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_Packaging_Appx", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-version = "0.1"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# macquit.rs: `applicationShouldTerminate:` on the app delegate (Dock "Quit", log out); the version tao and muda already use
objc2 = "0.6"
# macquit.rs: the block for the power-off notice (already in the lock file, tao and muda use it)
block2 = "0.6"
# macnotify.rs (W5.10, 1.0.11): the permission for notifications and the Dock badge, and the notifications themselves (UNUserNotificationCenter); versions already in the lock file (wry / tauri-plugin use them)
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSBundle", "NSString", "NSError", "NSURL"] }
# macprint.rs (W5.3): the window-less print view and the print sheet; the versions wry already pulls in (same features as wry plus the few it does not use)
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences", "WKNavigation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSWindow", "NSView", "NSResponder", "NSPrintInfo", "NSPrintOperation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }

# quit watchdog (lib.rs `exit_watchdog`): a last way to end the process that skips the exit handlers of the libraries; already in the lock file
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# asks the session bus whether a tray host exists (shell.rs); the notification plugin uses the same version
zbus = "5"
# shows the Linux notifications and returns the answer of the bus (the plugin that wraps it drops the result); the version the plugin uses
notify-rust = "4.18"
# the system clipboard for copy_text (lib.rs); the version tauri and wry already use
gtk = "0.18"
# linuxview.rs: the web view's own signals (web process ended / not responding) and a redraw; the exact version tauri's runtime pins
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
# testbridge/native.rs (debug builds only): reads the answer of a script run in the web view; the exact version webkit2gtk already uses
javascriptcore-rs = "=1.1.2"
# testbridge/native.rs (debug builds only): the PNG of the Linux snapshot; the version already in Cargo.lock (tauri's image-png uses it)
png = "0.17"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# imap 2.4.1 with two panics turned into errors (panic = "abort" in the release profile): see vendor/imap-2.4.1/HEY-LOOK-PATCH.md
[patch.crates-io]
imap = { path = "vendor/imap-2.4.1" }
# tao 0.37.1 never releases a closed window (macOS: the NSWindow, tao's delegate and wry's parent view stay alive, about 1.4 MB per closed pop-out): tao issue #1327,
# fixed by PR #1368 (commit 9aa859e). Exit rule: when crates.io has a tao 0.37.x whose changelog lists #1368 (expected 0.37.2), delete this line and run
# `cargo update -p tao --precise <version>` (the test tao_carries_the_macos_window_release_fix accepts both).
tao = { git = "https://github.com/tauri-apps/tao", rev = "9aa859e1fe61d664f8fd33f4593f9fac4a0012d5" }

[features]
# QA kits (debug builds): `tauri build --debug --features gui-subsystem` makes a Windows GUI program like the release build (main.rs), so the debug console does not take the foreground
gui-subsystem = []
# QA kits only, never in a release or CI release build (scripts/test-qa-secrets-off.mjs): the credentials of the app live in qa-secrets.json in the data folder instead of the system store, so a QA copy does not ask for the system password. Not in `default`.
qa-secrets = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# smtpsize.rs tests: a fake TLS mail server whose throw-away certificate is generated when the tests run (no key is kept in the repository);
# rustls is the version reqwest already uses, rcgen is MIT OR Apache-2.0
rustls = "0.23"
rcgen = "0.14"

# The OpenPGP key locking hashes 62 MB per passphrase try (openpgp::S2K_COUNT, W6.10): at opt-level 0 that takes tens of seconds per unlock in a debug build and the pgp tests time out.
[profile.dev.package.sha2]
opt-level = 3
