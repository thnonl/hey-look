[package]
name = "hey-look"
version = "0.1.0"
description = "Hey Look! desktop mail client"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hey_look_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
imap = "2.4.1"
native-tls = "0.2.18"
mail-parser = "0.11.9"
lettre = "0.11.23"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form"] }
chrono = "0.4.45"
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.23.1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
keyring = "3"
sha2 = "0.11.0"
rand = "0.10.3"
urlencoding = "2.1.3"
fontdue = "0.9"
hickory-resolver = "0.26.3"
roxmltree = "0.21.1"
pgp = { version = "0.21", default-features = false }
rand08 = { package = "rand", version = "0.8" }
smallvec = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
